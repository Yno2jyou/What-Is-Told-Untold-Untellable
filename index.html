  overflow-x: hidden;
  width: 100%;
  max-width: 100%;
  /* モバイルブラウザの自動文字サイズ調整(フォントブースティング)を無効化。
     これが原因で、閲覧モード(複数の<p>)と編集モード(単一のcontenteditable)で
     同じfont-size指定でも実際の描画サイズがずれ、一行あたりの文字数が変わってしまう。 */
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}
html, body { background: var(--bg); color: var(--fg); }

#app {
  overflow-x: hidden;
  max-width: 100%;
  width: 100%;
}

body {
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 2.0;
  letter-spacing: 0.03em;
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
  width: 100%;
  max-width: 100%;
  background:
    radial-gradient(ellipse 130% 90% at 50% -25%, #12101a 0%, transparent 55%),
    radial-gradient(ellipse 70% 50% at 90% 100%, #0e0c12 0%, transparent 50%),
    radial-gradient(ellipse 50% 40% at 5% 80%, #0c0a10 0%, transparent 45%),
    linear-gradient(180deg, #08070c 0%, #060508 45%, #050406 100%);
  background-attachment: fixed;
}

body::before, body::after {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
}
body::before {
  opacity: 0.28;
  background-image:
    radial-gradient(1px 1px at 7% 14%, rgba(255,255,255,0.45), transparent),
    radial-gradient(1px 1px at 18% 32%, rgba(255,255,255,0.3), transparent),
    radial-gradient(1px 1px at 33% 9%, rgba(255,255,255,0.38), transparent),
    radial-gradient(1px 1px at 47% 44%, rgba(255,255,255,0.25), transparent),
    radial-gradient(1px 1px at 61% 20%, rgba(255,255,255,0.35), transparent),
    radial-gradient(1px 1px at 76% 38%, rgba(255,255,255,0.28), transparent),
    radial-gradient(1px 1px at 89% 16%, rgba(255,255,255,0.32), transparent),
    radial-gradient(1px 1px at 12% 58%, rgba(255,255,255,0.24), transparent),
    radial-gradient(1px 1px at 27% 72%, rgba(255,255,255,0.28), transparent),
    radial-gradient(1px 1px at 44% 82%, rgba(255,255,255,0.3), transparent),
    radial-gradient(1px 1px at 58% 62%, rgba(255,255,255,0.22), transparent),
    radial-gradient(1px 1px at 72% 78%, rgba(255,255,255,0.26), transparent),
    radial-gradient(1px 1px at 86% 68%, rgba(255,255,255,0.24), transparent),
    radial-gradient(1px 1px at 94% 52%, rgba(255,255,255,0.3), transparent),
    radial-gradient(1px 1px at 4% 88%, rgba(255,255,255,0.22), transparent),
    radial-gradient(1px 1px at 22% 94%, rgba(255,255,255,0.26), transparent),
    radial-gradient(1px 1px at 52% 92%, rgba(255,255,255,0.28), transparent),
    radial-gradient(1px 1px at 78% 96%, rgba(255,255,255,0.24), transparent),
    radial-gradient(1px 1px at 96% 84%, rgba(255,255,255,0.26), transparent);
  background-repeat: no-repeat; background-size: 100% 100%;
}
body::after {
  opacity: 0.2;
  background-image:
    radial-gradient(1.2px 1.2px at 14% 22%, rgba(230,220,255,0.35), transparent),
    radial-gradient(1.2px 1.2px at 62% 28%, rgba(200,210,240,0.3), transparent),
    radial-gradient(1.2px 1.2px at 38% 58%, rgba(255,255,255,0.28), transparent),
    radial-gradient(1.2px 1.2px at 82% 72%, rgba(190,200,230,0.25), transparent),
    radial-gradient(1.2px 1.2px at 9% 78%, rgba(255,255,255,0.24), transparent),
    radial-gradient(1.2px 1.2px at 48% 88%, rgba(220,225,245,0.26), transparent),
    radial-gradient(1.2px 1.2px at 74% 12%, rgba(255,255,255,0.3), transparent),
    radial-gradient(1.2px 1.2px at 28% 42%, rgba(180,190,230,0.18), transparent);
  background-repeat: no-repeat; background-size: 100% 100%;
}

.sky-star {
  position: fixed; border-radius: 50%; pointer-events: none; z-index: 0;
  background: #fff; will-change: opacity;
  animation-name: star-twinkle; animation-timing-function: ease-in-out; animation-iteration-count: infinite;
}
@keyframes star-twinkle { 0%, 100% { opacity: var(--dim, 0.12); } 50% { opacity: var(--bright, 0.65); } }

.shooting-star {
  position: fixed; top: 0; left: 0; width: 2px; height: 2px; background: #fff;
  border-radius: 50%; pointer-events: none; z-index: 2; opacity: 0;
  box-shadow: 0 0 2px 1px rgba(220, 225, 255, 0.5); will-change: transform, opacity;
}
.shooting-star::after {
  content: ""; position: absolute; top: 50%; right: 1px; width: 0; height: 1px;
  transform: translateY(-50%); transform-origin: right center;
  background: linear-gradient(to left, rgba(255,255,255,0.85) 0%, rgba(190,200,240,0.4) 45%, transparent 100%);
  border-radius: 1px;
}
.shooting-star.is-flying { animation: shoot-move 1.25s cubic-bezier(0.15, 0.6, 0.3, 1) forwards; }
.shooting-star.is-flying::after { animation: shoot-trail 1.25s cubic-bezier(0.15, 0.6, 0.3, 1) forwards; }
@keyframes shoot-move {
  0% { opacity: 0; transform: rotate(var(--angle, 35deg)) translateX(0); }
  8% { opacity: 1; } 70% { opacity: 1; }
  100% { opacity: 0; transform: rotate(var(--angle, 35deg)) translateX(var(--dist, 240px)); }
}
@keyframes shoot-trail {
  0% { width: 0; opacity: 0; } 10% { width: 48px; opacity: 1; }
  55% { width: 88px; opacity: 0.7; } 100% { width: 22px; opacity: 0; }
}

header, main, footer, nav, #app { position: relative; z-index: 1; }

a { color: var(--accent); text-decoration: none; transition: color 0.25s ease; }
a:hover { color: var(--fg); }

header {
  max-width: var(--max-width); margin: 0 auto; padding: 88px 24px 0; text-align: center;
}
.site-title {
  font-size: 22px; font-weight: 300; letter-spacing: 0.14em; margin: 0 0 14px; color: var(--fg);
  font-family: "Didot", "Bodoni MT", "Didot LT STD", "Hoefler Text", "Garamond", "Times New Roman", "Yu Mincho", serif;
}
p.site-title { font-size: 22px; font-weight: normal; }
.site-subtitle { font-family: var(--font-mono); font-size: 11px; color: var(--fg-dim); letter-spacing: 0.18em; margin: 0 0 8px; }
.site-catchcopy {
  font-size: 16px; font-weight: normal; color: var(--fg); letter-spacing: 0.08em;
  line-height: 1.85; margin: 22px 0 0; text-align: center;
}
.site-subcopy {
  font-family: var(--font-mono); font-size: 11px; color: var(--fg-dim);
  letter-spacing: 0.12em; line-height: 1.85; margin: 10px 0 0; text-align: center;
}
.header-rule { width: 48px; height: 1px; background: var(--line); margin: 16px auto 0; }

.epigraph {
  max-width: var(--max-width); margin: 48px auto 0; padding: 0 28px; text-align: center;
  font-size: 13px; color: var(--fg-dim); line-height: 1.95; letter-spacing: 0.05em;
}
.epigraph span { display: block; }
.epigraph .indent { padding-left: 1.6em; margin-top: 0.35em; }

main { max-width: var(--max-width); margin: 0 auto; padding: 40px 24px 100px; }
/* 作品本文：ナビ直下の余白を抑える */
main#honbun { padding-top: 28px; }

.intro { text-align: center; font-size: 13px; color: var(--fg-dim); line-height: 1.95; margin: -24px 0 20px; letter-spacing: 0.04em; }
.intro p { margin: 0 0 1.1em; }

.works { display: flex; flex-direction: column; gap: 28px; }

.work-card {
  display: block; background: var(--card-bg); border: 1px solid var(--line); border-radius: 2px;
  padding: 36px 32px 32px; transition: border-color 0.3s ease, background 0.3s ease, transform 0.25s ease;
  position: relative; overflow: hidden; cursor: pointer;
}
.work-card::before {
  content: ""; position: absolute; top: 0; left: 0; width: 2px; height: 100%;
  background: var(--accent-soft); opacity: 0; transition: opacity 0.3s ease;
}
.work-card:hover { border-color: #4a443e; background: rgba(18, 16, 18, 0.85); transform: translateY(-2px); }
.work-card:hover::before { opacity: 1; }
.work-number { font-family: var(--font-mono); font-size: 11px; color: var(--fg-dim); letter-spacing: 0.18em; margin-bottom: 14px; }
.work-title { font-size: 20px; font-weight: normal; letter-spacing: 0.14em; margin: 0 0 6px; color: var(--fg); }
.work-subtitle { font-family: var(--font-mono); font-size: 12px; color: var(--fg-dim); letter-spacing: 0.1em; margin: 0 0 18px; }
.work-desc { font-size: 13.5px; color: var(--fg-dim); line-height: 1.95; letter-spacing: 0.03em; margin: 0 0 22px; text-indent: 0; }
.work-link { font-family: var(--font-mono); font-size: 11px; color: var(--accent); letter-spacing: 0.16em; border-bottom: 1px dotted var(--accent-soft); padding-bottom: 1px; display: inline-block; }
.work-card:hover .work-link { color: var(--fg); border-bottom-color: var(--fg-dim); }
.work-card-footer {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 16px;
  margin-top: 4px;
}
.work-meta {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--fg-dim);
  letter-spacing: 0.08em;
  white-space: nowrap;
  margin-left: auto;
  opacity: 0.85;
}

footer {
  max-width: var(--max-width); margin: 0 auto; padding: 40px 24px 80px; text-align: center;
  font-family: var(--font-mono); font-size: 11px; color: var(--fg-dim);
  border-top: 1px solid var(--line); letter-spacing: 0.1em;
}
footer p { margin: 6px 0; line-height: 1.9; }

/* work-page specific (ported from individual work files) */
nav.work-nav { max-width: var(--max-width); margin: 24px auto 0; padding: 0 24px 18px; text-align: center; font-family: var(--font-mono); font-size: 12px; color: var(--fg-dim); }
nav.work-nav a { margin: 0 10px; border-bottom: 1px dotted var(--accent); }

#toc { max-width: var(--max-width); margin: 0 auto 28px; padding: 0 24px; display: none; }
#toc.is-open { display: block; }
#toc ol { list-style: none; padding: 12px 0 8px; margin: 0; font-size: 13px; line-height: 2.05; border-top: 1px solid var(--line); }
#toc li { margin: 0; padding: 0; }
#toc a { border-bottom: none; color: var(--fg); }
#toc a:hover { color: var(--accent); }

.section { margin-top: 56px; }
/* 目次(#toc)が先に来るため first-child だけでは効かない → 直後の章も先頭扱い */
.section:first-child,
#toc + .section,
main > .section:first-of-type {
  margin-top: 0;
}
.section-title {
  font-size: 15px; font-weight: normal; color: var(--fg-dim); text-align: center;
  letter-spacing: 0.2em; margin: 0 0 28px; padding: 0 12px 12px;
  border-bottom: 1px solid var(--line);
  /* 文字の途中では折り返さず、softBreakTitle の <wbr>（、の直後）だけで改行 */
  word-break: keep-all;
  line-break: strict;
  overflow-wrap: normal;
  max-width: 100%;
  box-sizing: border-box;
}
/* 目次：折り返したとき二行目を「：」から三字ほど右に（入りきるときは一行のまま） */
#toc a {
  display: inline-block;
  max-width: 100%;
  line-height: 1.7;
  word-break: keep-all;
  line-break: strict;
  overflow-wrap: normal;
  padding-left: 6em;
  text-indent: -6em;
  box-sizing: border-box;
}
main p { margin: 0 0 1.4em; text-indent: 1em; }
main p.no-indent { text-indent: 0; }

/* 本文：main カラム幅いっぱいで表示（閲覧・編集共通） */
main#honbun:not(.is-editing) .section,
main#honbun.is-editing .chapter-edit-body,
main#honbun:not(.is-editing) .afterword-content {
  max-width: 100%;
  width: 100%;
  margin-left: 0;
  margin-right: 0;
  box-sizing: border-box;
  letter-spacing: var(--honbun-tracking);
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}
main#honbun:not(.is-editing) .section > p,
main#honbun.is-editing .chapter-edit-body > p,
main#honbun:not(.is-editing) .afterword-content > p {
  letter-spacing: var(--honbun-tracking);
  max-width: 100%;
  box-sizing: border-box;
}
main#honbun:not(.is-editing) .section > p {
  margin-left: 0;
  margin-right: 0;
}

/* 場面区切り（中央） */
hr.scene-break,
.scene-break {
  border: 0;
  height: 0;
  margin: 2.6em auto !important;
  padding: 0;
  width: min(42%, 160px);
  max-width: 160px;
  border-top: 1px solid var(--line);
  opacity: 0.85;
  display: block;
  background: none;
  margin-left: auto !important;
  margin-right: auto !important;
}
main#honbun.is-editing hr.scene-break,
main#honbun.is-editing .scene-break {
  margin: 1.8em auto;
  border-top-color: var(--accent-soft);
  opacity: 1;
}

.afterword-section { max-width: var(--max-width); margin: 0 auto; padding: 0 24px 60px; text-align: center; }
.afterword-toggle {
  background: none; border: 1px solid var(--line); color: var(--fg-dim); font-family: var(--font-mono);
  font-size: 12px; letter-spacing: 0.16em; padding: 10px 28px; cursor: pointer; transition: all 0.25s ease;
}
.afterword-toggle:hover { border-color: var(--accent-soft); color: var(--fg); }
.afterword-content { margin-top: 32px; text-align: left; }
.afterword-content.is-open {}
.aw-title { text-align: center; font-size: 15px; font-weight: normal; color: var(--fg-dim); letter-spacing: 0.2em; margin: 0 0 32px; }
.aw-epigraph { text-align: center; font-size: 13px; color: var(--fg-dim); line-height: 1.9; margin: 0 0 40px; }
.aw-epigraph span { display: block; }
.aw-epigraph .indent { padding-left: 1.6em; margin-top: 0.35em; }
.afterword-content p { margin: 0 0 1.3em; text-indent: 1em; line-height: 1.95; font-size: 14px; color: var(--fg-dim); }
.afterword-content p.no-indent { text-indent: 0; }

@media (max-width: 520px) {
  /* 本文だけ小さくして一度に読める量を増やす（タイトル・紹介文は維持） */
  body { background-attachment: scroll !important; }
  header { padding: 56px 18px 24px; }
  .site-title { font-size: 16px; letter-spacing: 0.1em; }
  p.site-title { font-size: 16px; }
  .site-catchcopy { font-size: 16px; }
  .intro { font-size: 12px; }
  main { padding: 40px 16px 80px; }
  main p { font-size: 14px; line-height: 1.85; letter-spacing: var(--honbun-tracking); margin: 0 0 1.2em; }
  .work-card { padding: 28px 22px 26px; }
  .work-title { font-size: 17px; }
  .epigraph { padding: 0 18px; font-size: 12px; }
  .section-title {
    letter-spacing: 0.06em;
    line-height: 1.7;
    padding: 0 8px 12px;
  }
  main#honbun.is-editing .chapter-edit-title,
  main#honbun.is-editing h2.section-title {
    letter-spacing: 0.06em;
    line-height: 1.7;
    padding: 0 8px 12px;
  }
  main#honbun:not(.is-editing) .section,
  main#honbun.is-editing .chapter-edit-body {
    max-width: 100%;
    width: 100%;
  }
  main#honbun:not(.is-editing) .section > p,
  main#honbun.is-editing .chapter-edit-body,
  main#honbun.is-editing .chapter-edit-body > p {
    font-family: var(--font-body);
    font-size: 14px;
    line-height: 1.85;
    letter-spacing: var(--honbun-tracking);
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }
  main#honbun.is-editing .chapter-edit-body {
    padding-left: 0;
    padding-right: 0;
  }
  main#honbun.is-editing .chapter-edit-body > p { margin: 0 0 1.2em; }
  main#honbun.is-editing {
    box-shadow: none;
  }
  main#honbun.is-editing .chapter-edit-body:focus {
    box-shadow: none;
  }
}

        afterwordHtml =
          '<div class="afterword-section">\n' +
          '  <button type="button" class="afterword-toggle" aria-expanded="false">最後に</button>\n' +
          '  <div class="afterword-content" hidden>\n' +
          '    <h2 class="aw-title">' + esc(title || "あとがき") + "</h2>\n" +
          "    " + parasToHtml(paras) + "\n" +
          "  </div>\n</div>";
        return;
      }

      var id = "ch" + chIndex;
      chIndex += 1;
      var displayTitle = title || (chapters.length === 1 ? "" : ("第" + chIndex + "話"));
      if (displayTitle) {
        tocItems.push('<li><a href="#' + id + '">' + softBreakTitle(displayTitle) + "</a></li>");
      }
      var titleHtml = displayTitle
        ? '  <h2 class="section-title">' + softBreakTitle(displayTitle) + "</h2>\n"
        : "";
      sectionsHtml.push(
        '<div class="section" id="' + id + '">\n' +
        titleHtml +
        "    " + parasToHtml(paras) + "\n" +
        "</div>"
      );
    });

    var toc = tocItems.length
      ? '<div id="toc">\n  <ol>\n    ' + tocItems.join("\n    ") + "\n  </ol>\n</div>\n\n"
      : "";
    return toc + sectionsHtml.join("\n\n") + (afterwordHtml ? "\n\n" + afterwordHtml : "");
  }

  /** 既存 HTML 本文 → 編集用プレーンテキスト */
  function contentToPlain(html) {
    if (html == null || html === "") return "";
    if (!looksLikeHtml(html)) return String(html);
    try {
      var doc = new DOMParser().parseFromString("<div id='__root'>" + html + "</div>", "text/html");
      var root = doc.getElementById("__root") || doc.body;
      var sections = root.querySelectorAll(".section");
      var parts = [];
      if (sections.length) {
        sections.forEach(function (sec) {
          var titleEl = sec.querySelector(".section-title");
          if (titleEl) {
            var t = (titleEl.textContent || "").trim();
            if (t) parts.push("# " + t);
          }
          sec.querySelectorAll("p").forEach(function (p) {
            var t = (p.textContent || "").trim();
            if (t) parts.push(t);
          });
        });
      }
      var aw = root.querySelector(".afterword-content");
      if (aw) {
        var awTitle = aw.querySelector(".aw-title");
        parts.push("# " + ((awTitle && awTitle.textContent) || "あとがき").trim());
        var epi = aw.querySelector(".aw-epigraph");
        if (epi) {
          var epiLines = [];
          epi.querySelectorAll("span").forEach(function (sp) {
            var t = (sp.textContent || "").trim();
            if (t) epiLines.push(t);
          });
          if (epiLines.length) parts.push(epiLines.join("\n"));
        }
        aw.querySelectorAll("p").forEach(function (p) {
          var t = (p.textContent || "").trim();
          if (t) parts.push(t);
        });
      }
      if (parts.length) {
        return parts.join("\n\n").replace(/\n{3,}/g, "\n\n").trim();
      }
      return brToPlain(html);
    } catch (e) {
      return brToPlain(html);
    }
  }

  /** 保存済み HTML から余分な <main> ラップを外す */
  function normalizeWorkHtml(html) {
    html = String(html == null ? "" : html);
    if (!html) return "";
    // 内側にネストされた <main id="honbun">...</main> を中身だけに展開
    html = html.replace(/<main\b[^>]*\bid=["']honbun["'][^>]*>/gi, "");
    html = html.replace(/<main\b[^>]*>/gi, "");
    html = html.replace(/<\/main>/gi, "");
    return html.trim();
  }

    function applyTitleSoftBreaks(html) {
    html = String(html || "");
    // 章タイトル
    html = html.replace(
      /(<h2\b[^>]*class="[^"]*section-title[^"]*"[^>]*>)([\s\S]*?)(<\/h2>)/gi,
      function (_, open, inner, close) {
        var text = inner.replace(/<[^>]+>/g, "")
          .replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"');
        return open + softBreakTitle(text) + close;
      }
    );
    // 目次リンク
    html = html.replace(
      /(<a\b[^>]*href="#ch\d+"[^>]*>)([\s\S]*?)(<\/a>)/gi,
      function (_, open, inner, close) {
        var text = inner.replace(/<[^>]+>/g, "")
          .replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"');
        return open + softBreakTitle(text) + close;
      }
    );
    return html;
  }


  /** 本文HTMLから文字数を数える（タグ・空白除外） */
  function countWorkChars(content) {
    var text = String(content == null ? "" : content)
      .replace(/<script[\s\S]*?<\/script>/gi, "")
      .replace(/<style[\s\S]*?<\/style>/gi, "")
      .replace(/<[^>]+>/g, "")
      .replace(/&nbsp;/gi, " ")
      .replace(/&amp;/gi, "&")
      .replace(/&lt;/gi, "<")
      .replace(/&gt;/gi, ">")
      .replace(/&quot;/gi, '"')
      .replace(/&#(\d+);/g, function (_, n) {
        try { return String.fromCharCode(Number(n)); } catch (e) { return ""; }
      })
      .replace(/\s+/g, "");
    return text.length;
  }

  /** 「12,345文字/25分」形式。読了目安は約500字/分 */
  function formatWorkReadingMeta(content) {
    var n = countWorkChars(content);
    if (n <= 0) return "0文字/0分";
    var mins = Math.max(1, Math.ceil(n / 500));
    var num = (typeof n.toLocaleString === "function") ? n.toLocaleString("ja-JP") : String(n);
    return num + "文字/" + mins + "分";
  }

  function formatContent(s) {
    if (s == null || s === "") return "";
    if (looksLikeHtml(s) && (s.indexOf("class=\"section\"") >= 0 || s.indexOf("<p") >= 0 || s.indexOf("id=\"toc\"") >= 0)) {
      return applyTitleSoftBreaks(normalizeWorkHtml(s));
    }
    return applyTitleSoftBreaks(plainToContent(s));
  }

  /* ===== Firestore 初期化・読み込み =====
     注意: 初期データの書き込み(seed)はログインしていないと
     セキュリティルールにより失敗するため、管理者がログインして
     いるときだけ実行します。未ログイン時にFirestoreが空だった
     場合は、ページ内蔵の初期データをその場だけ表示します
     （保存はされません。管理者が一度ログインすれば自動的に
     Firestoreへ書き込まれ、以後は全員に永続的に反映されます）。
  ===== */
  async function ensureSeededIfAdmin() {
    if (!isAdmin()) return;
    var metaSnap = await getDoc(META_REF);
    if (!metaSnap.exists()) {
      await setDoc(META_REF, { site: DEFAULTS.site, theme: { bg: "#060508", fg: "#e6e2dc", accent: "#9a8b7a" }, radar: DEFAULT_RADAR, quiz: DEFAULT_QUIZ, overview: DEFAULT_OVERVIEW });
    } else {
      var md = metaSnap.data() || {};
      var patch = {};
      if (!("radar" in md)) patch.radar = DEFAULT_RADAR;
      if (!("quiz" in md)) patch.quiz = DEFAULT_QUIZ;
      if (!("overview" in md)) patch.overview = DEFAULT_OVERVIEW;
      if (Object.keys(patch).length) await updateDoc(META_REF, patch);
    }
    var worksSnap = await getDocs(WORKS_COL);
    if (worksSnap.empty) {
      var batch = writeBatch(db);
      DEFAULTS.works.forEach(function (w) {
        var ref = doc(db, "site_works", w.id);
        batch.set(ref, {
          number: w.number, title: w.title, subtitle: w.subtitle,
          desc: w.desc, content: w.content,
          order: DEFAULTS.works.indexOf(w),
          published: w.published !== false,
          secret: !!w.secret
        });
      });
      await batch.commit();
    }
  }

  function withTimeout(promise, ms, label) {
    return new Promise(function (resolve, reject) {
      var done = false;
      var t = setTimeout(function () {
        if (done) return;
        done = true;
        reject(new Error((label || "timeout") + " after " + ms + "ms"));
      }, ms);
      Promise.resolve(promise).then(function (v) {
        if (done) return;
        done = true;
        clearTimeout(t);
        resolve(v);
      }, function (err) {
        if (done) return;
        done = true;
        clearTimeout(t);
        reject(err);
      });
    });
  }

  /* データ読み込みの世代番号。古いレスポンスが新しい遷移を上書きしないようにする */
  var _loadSeq = 0;
  var _navSeq = 0;
  var _seedDone = false;

  function buildDefaultsCache() {
    return {
      site: DEFAULTS.site,
      theme: { bg: "#060508", fg: "#e6e2dc", accent: "#9a8b7a" },
      radar: DEFAULT_RADAR,
      quiz: DEFAULT_QUIZ,
      overview: JSON.parse(JSON.stringify(DEFAULT_OVERVIEW)),
      works: DEFAULTS.works.map(function (w) {
        return Object.assign({}, w, { published: w.published !== false });
      })
    };
  }

  /**
   * Firestore から最新データを取得して cache を更新する。
   * opts.seed === true のときだけ（初回など）シード処理を走らせる。
   * 失敗時は既存の cache を維持し、作品数が突然 DEFAULTS に戻るのを防ぐ。
   */
  async function loadData(opts) {
    opts = opts || {};
    var seq = ++_loadSeq;
    invalidateEnglishSnapshot();

    var shouldSeed = opts.seed === true || (opts.seed !== false && isAdmin() && !_seedDone && !cache);
    if (shouldSeed) {
      try {
        await withTimeout(ensureSeededIfAdmin(), 8000, "seed");
        _seedDone = true;
      } catch (e) {
        console.warn("seed skipped:", e);
      }
    }

    try {
      // meta と works を並列取得してモバイルの待ち時間を短縮
      var pair = await withTimeout(
        Promise.all([getDoc(META_REF), getDocs(WORKS_COL)]),
        12000,
        "load"
      );
      // より新しい loadData が始まっていたら結果を捨てる
      if (seq !== _loadSeq) return cache;

      var metaSnap = pair[0];
      var worksSnap = pair[1];
      if (!metaSnap.exists() || worksSnap.empty) {
        // Firestore が空のときだけ DEFAULTS。既に有効な cache があれば維持。
        if (!cache) cache = buildDefaultsCache();
        return cache;
      }
      var meta = metaSnap.data();
      var works = [];
      worksSnap.forEach(function (d) {
        var row = Object.assign({ id: d.id }, d.data());
        if (row.published === undefined) row.published = true;
        if (row.secret === undefined) row.secret = false;
        works.push(row);
      });
      works.sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
      cache = {
        site: Object.assign({ title: "", subtitle: "", epigraph: "", catchcopy: "", subcopy: "" }, meta.site || {}),
        theme: meta.theme || { bg: "#060508", fg: "#e6e2dc", accent: "#9a8b7a" },
        radar: Object.assign({}, DEFAULT_RADAR, meta.radar || {}),
        quiz: Object.assign({}, DEFAULT_QUIZ, meta.quiz || {}, {
          axes: (meta.quiz && meta.quiz.axes) || DEFAULT_QUIZ.axes,
          questions: (meta.quiz && meta.quiz.questions) || DEFAULT_QUIZ.questions
        }),
        overview: Object.assign({}, DEFAULT_OVERVIEW, meta.overview || {}, {
          timeline: (meta.overview && meta.overview.timeline) || DEFAULT_OVERVIEW.timeline,
          pie: (meta.overview && meta.overview.pie) || DEFAULT_OVERVIEW.pie
        }),
        works: works
      };
      return cache;
    } catch (e) {
      console.warn("読み込みに失敗:", e);
      // 重要: 失敗時に DEFAULTS で上書きしない（作品数のチラつき・不整合の主因）
      if (!cache) cache = buildDefaultsCache();
      return cache;
    }
  }

    var next = Object.assign({}, cache.site, partial);
    await updateDoc(META_REF, { site: next });

  /** 作品の掲載順を上下に移動（管理画面） */
  async function moveWorkOrder(id, direction) {
    if (!cache || !cache.works || !cache.works.length) return;
    var works = cache.works.slice().sort(function (a, b) {
      return (a.order || 0) - (b.order || 0);
    });
    var i = -1;
    for (var k = 0; k < works.length; k++) {
      if (works[k].id === id) { i = k; break; }
    }
    var j = i + direction;
    if (i < 0 || j < 0 || j >= works.length) return;
    var tmp = works[i];
    works[i] = works[j];
    works[j] = tmp;
    var batch = writeBatch(db);
    works.forEach(function (w, idx) {
      batch.update(doc(db, "site_works", w.id), { order: idx });
      w.order = idx;
    });
    await batch.commit();
    cache.works = works;
    invalidateEnglishSnapshot();
  }

  var _saveToastTimer = null;
  function showSaveToast(message) {
    message = message || "保存完了！";

      el.id = "save-toast";

      el.setAttribute("role", "status");
      el.setAttribute("aria-live", "polite");
      document.body.appendChild(el);

    el.classList.remove("is-show");

    void el.offsetWidth;
    el.classList.add("is-show");

  /** 編集中の作品本文を保存（サイドバーから。実体はツールバーの保存ボタン） */
  function saveCurrentWorkEdits() {

  /* メニュー操作でフォーカスが外れても、直前の本文キャレット位置を覚えおく */
  var _savedEditorRange = null;
  var _savedEditorBody = null;
  document.addEventListener("selectionchange", function () {
    if (!document.body.classList.contains("is-editing")) return;
    var sel = window.getSelection();
    if (!sel || !sel.rangeCount || sel.isCollapsed === undefined) return;
    var node = sel.anchorNode;
    if (!node) return;
    if (node.nodeType === 3) node = node.parentNode;
    if (!node || !node.closest) return;
    var body = node.closest(".chapter-edit-body");
    if (!body) return;
    try {
      _savedEditorRange = sel.getRangeAt(0).cloneRange();
      _savedEditorBody = body;
    } catch (err) {}
  });

  /** 編集中の本文キャレット位置に区切り線を挿入（メニュー／ツールバー共用） */
  function insertSceneBreakAtCursor() {
    if (!document.body.classList.contains("is-editing")) {
      alert("編集モードでのみ区切り線を追加できます");
      return;
    }
    var sel = window.getSelection();
    var body = null;
    var range = null;

    if (sel && sel.rangeCount) {
      var node = sel.anchorNode;
      if (node && node.nodeType === 3) node = node.parentNode;
      if (node && node.closest) body = node.closest(".chapter-edit-body");
      if (body) {
        try { range = sel.getRangeAt(0); } catch (err) {}
      }
    }
    // メニュー操作で選択が消えている場合は保存済み位置を使う
    if (!body && _savedEditorBody && document.body.contains(_savedEditorBody)) {
      body = _savedEditorBody;
      range = _savedEditorRange;
    }
    if (!body) {
      var jumpEl = document.getElementById("chapter-jump");
      var blocks = app.querySelectorAll(".chapter-edit-block");
      var idx = jumpEl ? jumpEl.value : "";
      var block = (idx !== "" && blocks[idx]) ? blocks[idx] : blocks[0];
      body = block ? block.querySelector(".chapter-edit-body") : null;
    }
    if (!body) {
      alert("区切り線を入れる章の本文を選択してください");
      return;
    }

    var hr = document.createElement("hr");
    hr.className = "scene-break";
    try {
      if (range && body.contains(range.commonAncestorContainer)) {
        var r = range.cloneRange();
        r.collapse(false);
        var container = r.commonAncestorContainer;
        if (container.nodeType === 3) container = container.parentNode;
        var p = container && container.closest ? container.closest("p") : null;
        if (p && body.contains(p)) {
          if (p.nextSibling) body.insertBefore(hr, p.nextSibling);
          else body.appendChild(hr);
        } else {
          r.insertNode(hr);
        }
      } else {
        body.appendChild(hr);
      }
    } catch (err) {
      body.appendChild(hr);
    }

    try {
      body.focus();
      var after = hr.nextElementSibling;
      if (!after) {
        after = document.createElement("p");
        after.innerHTML = "<br>";
        body.appendChild(after);
      }
      var r2 = document.createRange();
      r2.selectNodeContents(after);
      r2.collapse(true);
      var s2 = window.getSelection();
      s2.removeAllRanges();
      s2.addRange(r2);
      _savedEditorRange = r2.cloneRange();
      _savedEditorBody = body;
    } catch (err2) {}
  }

  function slugifyId(title) {
    var base = String(title || "")
      .trim()
      .toLowerCase()
      .replace(/[^\w぀-ヿ㐀-鿿]+/g, "-")
      .replace(/^-+|-+$/g, "")
      .slice(0, 40);
    if (!base) base = "work";
    var id = base;
    var n = 2;
    var existing = {};
    (cache && cache.works || []).forEach(function (w) { existing[w.id] = true; });
    while (existing[id]) {
      id = base + "-" + n;
      n += 1;
    }
    return id;
  }

  /** 1始まりの整数 → ローマ数字（掲載順用） */
  function toRoman(num) {
    num = Math.floor(Number(num) || 0);
    if (num <= 0) return "";
    var vals = [1000, 900, 500, 400, 100, 90, 50, 40, 10, 9, 5, 4, 1];
    var syms = ["M", "CM", "D", "CD", "C", "XC", "L", "XL", "X", "IX", "V", "IV", "I"];
    var res = "";
    for (var i = 0; i < vals.length; i++) {
      while (num >= vals[i]) {
        res += syms[i];
        num -= vals[i];
      }
    }
    return res;
  }

  /**
   * 掲載順（order 昇順の一覧内の位置）からローマ数字を返す。
   * list を渡さない場合は cache.works（表示可能なもの）から求める。
   */
  function workRomanNumber(w, list) {
    if (!w) return "";
    var arr = list;
    if (!arr) {
      arr = (cache && cache.works) ? cache.works.filter(function (x) { return isWorkVisible(x); }) : [];
    }
    var idx = -1;
    for (var i = 0; i < arr.length; i++) {
      if (arr[i].id === w.id) { idx = i; break; }
    }
    return idx >= 0 ? toRoman(idx + 1) : "";
  }

  function nextWorkNumber() {
    var n = (cache && cache.works ? cache.works.length : 0);
    return toRoman(n + 1);
  }

  async function createWork(fields) {
    var id = slugifyId(fields.title);
    var order = (cache && cache.works) ? cache.works.length : 0;
    var initialBody = (fields.firstChapterTitle || "プロローグ").trim();
    var content = plainToContent("# " + initialBody + "\n\n（ここに本文を書いてください）");
    var row = {
      // number は互換のため残すが、表示は常に掲載順の自動ローマ数字
      number: toRoman(order + 1),
      title: (fields.title || "").trim(),
      subtitle: (fields.subtitle || "").trim(),
      desc: plainToBr(fields.desc || ""),
      content: content,
      order: order,
      published: true,
      secret: false
    };
    await setDoc(doc(db, "site_works", id), row);
    if (cache && cache.works) {
      cache.works.push(Object.assign({ id: id }, row));
    }
    return id;
  }

  /* ===== 星空演出 ===== */
  function createSkyStars(n) {
    document.querySelectorAll(".sky-star").forEach(function (el) { el.remove(); });
    var frag = document.createDocumentFragment();
    for (var i = 0; i < n; i++) {

      el.style.animationDuration = duration + "s";
      el.style.animationDelay = (-Math.random() * duration) + "s";

  function spawnShootingStar() {
    var star = document.createElement("div");

    if (meteorBurstTimer) clearInterval(meteorBurstTimer);
    // 流星群：短い間隔で連続発生
    function burstTick() {
      if (Date.now() >= meteorBurstEnd) {
        clearInterval(meteorBurstTimer);

      if (Math.random() < 0.55) setTimeout(spawnShootingStar, 80 + Math.random() * 180);

  function currentRoute() {
    var h = location.hash || "";
    if (h.indexOf("#/radar") === 0) return { name: "radar" };
    if (h.indexOf("#/tensen/") === 0) {
      return { name: "tensen", id: decodeURIComponent(h.slice(9).split(/[?#]/)[0]) };
    }
    if (h.indexOf("#/work/") === 0) {
      return { name: "work", id: decodeURIComponent(h.slice(7).split(/[?#]/)[0]) };

    return { name: "home" };

  }

  async function render(opts) {
    opts = opts || {};
    if (!cache) {
      showLoading();
      await loadData({ seed: true });
    }
    if (!cache) return;
    applyTheme(cache.theme);
    var route = currentRoute();
    if (route.name === "radar") {
      renderRadarPage(cache);
    } else if (route.name === "tensen") {
      var tw = cache.works.filter(function (w) { return w.id === route.id; })[0];
      if (!tw) { location.hash = "#/"; renderHome(cache); return; }
      if (tw.published === false && !isAdmin()) {
        location.hash = "#/";
        renderHome(cache);
        return;
      }
      if (tw.secret && !isSecretUnlocked() && !isManaging()) {
        location.hash = "#/";
        renderHome(cache);
        return;
      }
      renderTenSenPage(cache, tw);
    } else if (route.name === "work") {
      var work = cache.works.filter(function (w) { return w.id === route.id; })[0];
      if (!work) { renderHome(cache); return; }
      if (work.published === false && !isAdmin()) {
        location.hash = "#/";
        renderHome(cache);
        return;
      }
      if (work.secret && !isSecretUnlocked() && !isManaging()) {
        location.hash = "#/";
        renderHome(cache);
        return;
      }
      renderWork(cache, work);
    } else {
      renderHome(cache);
    }
    startStars();
    if (!opts.preserveScroll) window.scrollTo(0, 0);
    if (isEn()) scheduleTranslateDom();
  }

  async function refresh() {
    await loadData({ seed: false });
    await render();
  }

  /**
   * ハッシュ変更時の遷移。
   * 1) 既存 cache があれば即座に描画（モバイルで待ち時間を感じさせない）
   * 2) バックグラウンドで最新データを取得し、届いたら再描画
   * 連続タップ時は _navSeq で古い結果を捨てる
   */
  async function navigateAndRefresh() {
    var seq = ++_navSeq;
    if (cache) {
      await render();
    } else {
      showLoading();
    }
    try {
      await loadData({ seed: false });
    } catch (e) {
      console.warn("navigation refresh failed", e);
    }
    if (seq !== _navSeq) return;
    await render({ preserveScroll: false });
  }

  /* ===== 隠し仕様（イースターエッグ） ===== */
  var _eggTitleTaps = 0;
  var _eggTitleLast = 0;
  var _eggSubTaps = 0;
  var _eggSubLast = 0;
  var _eggPhase = "idle";
  var _eggPhaseTimer = null;
  var _eggCatchTaps = 0;
  var _eggCatchLast = 0;
  var _eggCatchPhase = "idle";
  var _eggCatchPhaseTimer = null;
  var _eggCmdMenuTaps = 0;
  var _eggCmdMenuLast = 0;
  var _eggCmdPhase = "idle"; /* idle | after-menu */
  var _eggCmdPhaseTimer = null;
  var TAP_GAP = 1200;
  var _rainTimer = null;
  var _rainLayer = null;

  function attachEasterEggs() {
    var titleEl = app.querySelector("header .site-title");
    var subEl = app.querySelector("header .site-subtitle");
    var catchEl = app.querySelector("header .site-catchcopy") || app.querySelector("#egg-catchcopy");

    function onTitleTap(e) {
      if (e) { e.preventDefault(); e.stopPropagation(); }
      var now = Date.now();
      if (now - _eggTitleLast > TAP_GAP) _eggTitleTaps = 0;
      _eggTitleLast = now;
      _eggTitleTaps += 1;

      /* メニュー5回のあと → タイトル5回で隠しコマンド一覧（最優先） */
      if (_eggCmdPhase === "after-menu") {
        if (_eggTitleTaps >= 5) {
          _eggTitleTaps = 0;
          _eggCmdPhase = "idle";
          if (_eggCmdPhaseTimer) { clearTimeout(_eggCmdPhaseTimer); _eggCmdPhaseTimer = null; }
          closeSidebar();
          openSecretGuideModal();
        }
        return;
      }

      if (isSecretUnlocked()) {
        if (_eggTitleTaps >= 3) {
          _eggTitleTaps = 0;
          lockSecretWork();
        }
        return;
      }

      if (_eggPhase === "after-meteor") {
        if (_eggTitleTaps >= 3) {
          _eggTitleTaps = 0;
          unlockSecretWork();
        }
        return;
      }

      if (_eggTitleTaps >= 5) {
        _eggTitleTaps = 0;
        startMeteorShower(30000);
        _eggPhase = "after-meteor";
        if (_eggPhaseTimer) clearTimeout(_eggPhaseTimer);
        _eggPhaseTimer = setTimeout(function () { _eggPhase = "idle"; }, 45000);
      }
    }

    function onSubTap(e) {
      if (e) { e.preventDefault(); e.stopPropagation(); }
      var now = Date.now();
      if (now - _eggSubLast > TAP_GAP) _eggSubTaps = 0;
      _eggSubLast = now;
      _eggSubTaps += 1;
      if (_eggSubTaps >= 3) {
        _eggSubTaps = 0;
        document.body.classList.toggle("is-inverted");
      }
    }

    function onCatchTap(e) {
      if (e) { e.preventDefault(); e.stopPropagation(); }
      var now = Date.now();
      // 解放フェーズ中は間隔を長く取る（大雨のあとゆっくりタップしても通る）
      var gapLimit = (_eggCatchPhase === "after-rain") ? 4000 : TAP_GAP;
      if (now - _eggCatchLast > gapLimit) _eggCatchTaps = 0;
      _eggCatchLast = now;
      _eggCatchTaps += 1;

      // タップフィードバック
      if (catchEl) {
        catchEl.classList.add("is-egg-pulse");
        setTimeout(function () { catchEl.classList.remove("is-egg-pulse"); }, 180);
      }

      if (isFactorUnlocked()) {
        if (_eggCatchTaps >= 5) {
          _eggCatchTaps = 0;
          startHeavyRain(30000);
        }
        return;
      }

      if (_eggCatchPhase === "after-rain") {
        if (_eggCatchTaps >= 3) {
          _eggCatchTaps = 0;
          unlockFactorTrader();
        }
        return;
      }

      if (_eggCatchTaps >= 5) {
        _eggCatchTaps = 0;
        startHeavyRain(30000);
        _eggCatchPhase = "after-rain";
        // 大雨中〜終了後も十分に受付（90秒）
        if (_eggCatchPhaseTimer) clearTimeout(_eggCatchPhaseTimer);
        _eggCatchPhaseTimer = setTimeout(function () {
          _eggCatchPhase = "idle";
          _eggCatchTaps = 0;
        }, 90000);
      }
    }

    function bindTap(el, handler) {
      if (!el) return;
      if (el.getAttribute("data-egg-bound") === "1") return;
      el.setAttribute("data-egg-bound", "1");
      var lastFire = 0;
      function fire(ev) {
        var t = Date.now();
        if (t - lastFire < 320) return;
        lastFire = t;
        handler(ev);
      }
      // pointerup 優先。click は pointer 非対応環境のフォールバック
      el.addEventListener("pointerup", fire);
      el.addEventListener("click", function (ev) {
        if (window.PointerEvent) return; // pointer がある環境では click を無視
        fire(ev);
      });
    }


        var epiEl = app.querySelector("#epigraph-area");
    // 言語切替は document の setupLangGesture のみ（二重発火防止）

    bindTap(titleEl, onTitleTap);
    bindTap(subEl, onSubTap);
    bindTap(catchEl, onCatchTap);

    updateFactorFab();
  }

  function openFactorTraderGame() {
    return; /* extracted site: no game */
    if (document.querySelector(".factor-game-overlay")) return;

    function decodeGameHtml() {
      var srcEl = document.getElementById("factor-trader-src");
      if (!srcEl) return "";
      try {
        var raw = String(srcEl.textContent || "").replace(/\s+/g, "");
        if (srcEl.getAttribute("data-encoding") === "base64" && raw) {
          var bin = atob(raw);
          if (typeof TextDecoder !== "undefined") {
            var bytes = new Uint8Array(bin.length);
            for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            return new TextDecoder("utf-8").decode(bytes);
          }
          // TextDecoder 非対応環境
          return decodeURIComponent(escape(bin));
        }
        var html = String(srcEl.textContent || "");
        var closeTag = "<" + "/" + "script>";
        return html.split("<\\" + "/" + "script>").join(closeTag);
      } catch (err) {
        console.warn("factor-trader decode failed", err);
        return "";
      }
    }

    var html = decodeGameHtml();
    if (!html || html.length < 100) {
      alert("ゲームデータの読み込みに失敗しました。");
      return;
    }

    var overlay = document.createElement("div");
    overlay.className = "factor-game-overlay";
    overlay.innerHTML =
      '<div class="factor-game-bar">' +
      "<span>FACTOR/TRADER</span>" +
      '<button type="button" data-close-factor>' + t("backToSite") + "</button>" +
      "</div>" +
      '<div class="factor-game-frame-wrap"></div>';
    document.body.appendChild(overlay);
    document.body.style.overflow = "hidden";

    var wrap = overlay.querySelector(".factor-game-frame-wrap");
    var iframe = document.createElement("iframe");
    iframe.className = "factor-game-frame";
    iframe.title = "FACTOR/TRADER";
    iframe.setAttribute("allow", "fullscreen");
    // about:blank は親と同オリジン扱いになり、Chrome の blob ブロックを回避できる
    iframe.src = "about:blank";
    wrap.appendChild(iframe);

    function close() {
      document.body.style.overflow = "";
      if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
    }
    overlay.querySelector("[data-close-factor]").addEventListener("click", close);

    function writeIntoIframe() {
      try {
        var doc = iframe.contentDocument || (iframe.contentWindow && iframe.contentWindow.document);
        if (!doc) throw new Error("no contentDocument");
        doc.open();
        doc.write(html);
        doc.close();
        return true;
      } catch (err) {
        console.warn("iframe write failed", err);
        return false;
      }
    }

    function openInNewWindow() {
      try {
        var w = window.open("", "_blank");
        if (!w) {
          alert("ポップアップがブロックされました。ブラウザで許可するか、もう一度お試しください。");
          return false;
        }
        w.document.open();
        w.document.write(html);
        w.document.close();
        return true;
      } catch (err) {
        console.warn("window.open write failed", err);
        return false;
      }
    }

    var written = false;
    function tryMount() {
      if (written) return;
      written = writeIntoIframe();
      if (!written) {
        // iframe に書けない場合は srcdoc、それでもダメなら別タブ
        try {
          iframe.removeAttribute("src");
          iframe.srcdoc = html;
          written = true;
        } catch (err2) {
          close();
          if (!openInNewWindow()) {
            alert("ゲームを表示できませんでした。別のブラウザで試すか、ポップアップを許可してください。");
          }
        }
      }
    }

    // about:blank の load 後に write（即時でも試す）
    iframe.addEventListener("load", function () {
      if (!written) tryMount();
    });
    setTimeout(function () {
      if (!written) tryMount();
    }, 0);

    // 描画失敗の検知
    setTimeout(function () {
      try {
        var doc = iframe.contentDocument;
        if (!doc) return;
        var root = doc.getElementById("root");
        if (root && root.childNodes.length === 0) {
          var fb = doc.getElementById("ft-fallback");
          if (fb) {
            fb.style.display = "block";
            fb.innerHTML = "ゲームの読み込みに失敗しました。<br>インターネット接続を確認してください（React を CDN から取得します）。<br><br>それでも表示されない場合は、メニューから再度開くか、別タブで開いてください。";
          }
          if (!overlay.querySelector("[data-open-tab]")) {
            var bar = overlay.querySelector(".factor-game-bar");
            var tabBtn = document.createElement("button");
            tabBtn.type = "button";
            tabBtn.setAttribute("data-open-tab", "1");
            tabBtn.textContent = t("openTab");
            tabBtn.addEventListener("click", function () { openInNewWindow(); });
            bar.appendChild(tabBtn);
          }
        }
      } catch (e1) {}
    }, 4000);

    var isTouch = window.matchMedia && window.matchMedia("(hover: none), (pointer: coarse)").matches;
    if (isTouch) {
      var top = target.getBoundingClientRect().top + (window.pageYOffset || 0) - 12;
      window.scrollTo(0, top);
      scrolling = false;
    } else if (typeof target.scrollIntoView === "function") {

      setTimeout(function () { scrolling = false; }, 900);

  }

  /* ===== 本文コピー：改行・一字下げ・空行をプレーンテキストに反映 ===== */
  function normalizeNovelLine(s) {
    return String(s || "")
      .replace(/\u00a0/g, " ")
      .replace(/\r\n/g, "\n")
      .replace(/\r/g, "\n")
      .replace(/\n+/g, "")
      .replace(/[ \t\f\v]+/g, " ")
      .trim();
  }

  function paragraphNeedsIndent(el, text) {
    if (el && el.classList && el.classList.contains("no-indent")) return false;
    if (/^[「『（(\[【─―—]/.test(text || "")) return false;
    return true;
  }

  function novelBlocksToPlain(blocks) {
    var lines = [];
    blocks.forEach(function (b) {
      if (!b) return;
      if (b.kind === "hr") {
        // 区切り線 → 空行（前後の段落と合わせて空行1つになるよう空文字行を入れる）
        if (lines.length && lines[lines.length - 1] !== "") lines.push("");
        return;
      }
      if (!b.text) return;
      if (b.kind === "h2") {
        lines.push(b.text);
      } else {
        lines.push((b.indent ? "　" : "") + b.text);
      }
    });
    return lines.join("\n");
  }

  /** 開いている作品の全文（章タイトル＋本文）をプレーンテキスト化
   *  章タイトルの前後は空行で区切る（タイトルの直後に空行→本文）
   */
  function getNovelPlainFull() {
    var main = app.querySelector("#honbun");
    if (!main) return "";
    var lines = [];

    function pushTitle(title) {
      title = normalizeNovelLine(title);
      if (!title) return;
      // 本文終わりと次の章タイトルの間にも空行
      if (lines.length && lines[lines.length - 1] !== "") lines.push("");
      lines.push(title);
      lines.push(""); // 章タイトルの直後に空行
    }
    function pushPara(el) {
      var t = normalizeNovelLine(el.textContent);
      if (!t) return;
      lines.push((paragraphNeedsIndent(el, t) ? "　" : "") + t);
    }
    function pushHr() {
      if (lines.length && lines[lines.length - 1] !== "") lines.push("");
    }

    var editBlocks = main.querySelectorAll(".chapter-edit-block");
    if (editBlocks.length) {
      editBlocks.forEach(function (block) {
        var titleEl = block.querySelector(".chapter-edit-title, h2.section-title");
        if (titleEl) pushTitle(titleEl.textContent);
        var body = block.querySelector(".chapter-edit-body");
        var kids = body ? body.children : [];
        Array.prototype.forEach.call(kids, function (el) {
          if (el.tagName === "HR" || (el.classList && el.classList.contains("scene-break"))) {
            pushHr();
            return;
          }
          if (el.tagName === "P") pushPara(el);
        });
      });
    } else {
      main.querySelectorAll(".section, .afterword-content").forEach(function (sec) {
        var titleEl = sec.querySelector(".section-title, .aw-title, h2");
        if (titleEl) pushTitle(titleEl.textContent);
        Array.prototype.forEach.call(sec.children, function (el) {
          if (titleEl && el === titleEl) return;
          if (el.tagName === "HR" || (el.classList && el.classList.contains("scene-break"))) {
            pushHr();
            return;
          }
          if (el.tagName === "P") pushPara(el);
        });
      });
      if (!lines.length) {
        main.querySelectorAll("h2.section-title, h2.aw-title, h2, p, hr.scene-break, hr").forEach(function (el) {
          if (el.tagName === "HR" || (el.classList && el.classList.contains("scene-break"))) {
            pushHr();
            return;
          }
          if (el.tagName === "H2") pushTitle(el.textContent);
          else if (el.tagName === "P") pushPara(el);
        });
      }
    }
    // 末尾の余分な空行を整理
    while (lines.length && lines[lines.length - 1] === "") lines.pop();
    return lines.join("\n");
  }

  function copyTextToClipboard(text) {
    text = String(text || "");
    if (!text) return Promise.reject(new Error("empty"));
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text);
    }
    return new Promise(function (resolve, reject) {
      try {
        var ta = document.createElement("textarea");
        ta.value = text;
        ta.setAttribute("readonly", "");
        ta.style.cssText = "position:fixed;left:-9999px;top:0;opacity:0;";
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        ta.setSelectionRange(0, ta.value.length);
        var ok = document.execCommand("copy");
        document.body.removeChild(ta);
        if (ok) resolve();
        else reject(new Error("execCommand failed"));
      } catch (err) {
        reject(err);
      }
    });
  }

  function getNovelPlainFromSelection() {
    var main = app.querySelector("#honbun");
    // 閲覧・編集モード共通（編集中も改行・一字下げ・区切り線→空行を反映）
    if (!main) return null;
    var sel = window.getSelection();
    if (!sel || sel.isCollapsed || !sel.rangeCount) return null;
    var range = sel.getRangeAt(0);
    var anc = range.commonAncestorContainer;
    if (anc.nodeType === 3) anc = anc.parentNode;
    if (!main.contains(anc) && anc !== main) return null;

    var candidates = main.querySelectorAll("h2.section-title, h2.aw-title, h2, p, hr.scene-break, hr");
    var hit = [];
    candidates.forEach(function (el) {
      try {
        if (!sel.containsNode(el, true)) return;
      } catch (err) {
        return;
      }
      if (el.tagName === "HR" || (el.classList && el.classList.contains("scene-break"))) {
        hit.push({ kind: "hr", el: el, fully: true });
        return;
      }
      var full = normalizeNovelLine(el.textContent);
      if (!full) return;
      if (el.tagName === "H2") {
        hit.push({ kind: "h2", el: el, text: full, fully: true });
        return;
      }
      var fully = false;
      try { fully = sel.containsNode(el, false); } catch (err) {}
      hit.push({
        kind: "p",
        el: el,
        text: full,
        fully: fully,
        indent: paragraphNeedsIndent(el, full)
      });
    });

    if (!hit.length) {
      var raw = sel.toString();
      if (!raw || !String(raw).trim()) return null;
      return String(raw).replace(/\r\n/g, "\n").replace(/\r/g, "\n");
    }

    // 1段落の部分選択：選択文字列を使い、段落先頭からの選択なら一字下げ
    if (hit.length === 1 && hit[0].kind === "p" && !hit[0].fully) {
      var partial = normalizeNovelLine(sel.toString());
      if (!partial) return null;
      var indent = false;
      try {
        var pre = document.createRange();
        pre.selectNodeContents(hit[0].el);
        pre.setEnd(range.startContainer, range.startOffset);
        if (!normalizeNovelLine(pre.toString())) indent = hit[0].indent;
      } catch (err) {}
      return (indent ? "　" : "") + partial;
    }

    var blocks = hit.map(function (h) {
      if (h.kind === "hr") return { kind: "hr" };
      if (h.kind === "h2") return { kind: "h2", text: h.text };
      return { kind: "p", text: h.text, indent: h.indent };
    });
    return novelBlocksToPlain(blocks);
  }

  document.addEventListener("copy", function (e) {
    try {
      var plain = getNovelPlainFromSelection();
      if (plain == null || plain === "") return;
      e.preventDefault();
      if (e.clipboardData) {
        e.clipboardData.setData("text/plain", plain);
        // 簡易 HTML（段落改行・一字下げ・区切り線由来の空行を保つ）
        var html = plain
          .split("\n")
          .map(function (line) {
            if (line === "") return "<p><br></p>";
            return "<p>" + line
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;") + "</p>";
          })
          .join("");
        e.clipboardData.setData("text/html", html);
      } else if (window.clipboardData) {
        window.clipboardData.setData("Text", plain);
      }
    } catch (err) {
      // 失敗時はブラウザ標準のコピーに任せる
    }
  });

  /** 作品ページから章一覧を取得（閲覧・編集共通） */
  function collectWorkChapters() {
    var items = [];
    var editTitles = app.querySelectorAll(".chapter-edit-title");
    if (editTitles.length) {
      editTitles.forEach(function (h, i) {
        var t = (h.textContent || "").replace(/\s+/g, " ").trim();
        items.push({
          idx: i,
          title: t || ("章 " + (i + 1)),
          el: h.closest(".chapter-edit-block") || h
        });
      });
      return items;
    }
    var sections = app.querySelectorAll("#honbun .section, main .section");
    if (sections.length) {
      sections.forEach(function (sec, i) {
        var h = sec.querySelector(".section-title");
        var t = h ? (h.textContent || "").replace(/\s+/g, " ").trim() : "";
        items.push({
          idx: i,
          title: t || ("第" + (i + 1) + "話"),
          id: sec.id || ("ch" + i),
          el: h || sec
        });
      });
      return items;
    }
    // 目次リンクから拾う
    var tocLinks = app.querySelectorAll("#toc a[href^='#']");
    tocLinks.forEach(function (a, i) {
      var href = a.getAttribute("href") || "";
      var id = href.charAt(0) === "#" ? href.slice(1) : "";
      var t = (a.textContent || "").replace(/\s+/g, " ").trim();
      items.push({
        idx: i,
        title: t || ("章 " + (i + 1)),
        id: id,
        el: id ? document.getElementById(id) : null
      });
    });
    return items;
  }

  function jumpToWorkChapter(item) {
    if (!item) return;
    // 編集モード：ツールバーの章ジャンプと同期
    var jumpEl = document.getElementById("chapter-jump");
    if (jumpEl && document.body.classList.contains("is-editing")) {
      jumpEl.value = String(item.idx);
      try {
        jumpEl.dispatchEvent(new Event("change", { bubbles: true }));
      } catch (err) {}
    }
    var target = item.el;
    if (!target && item.id) target = document.getElementById(item.id);
    if (!target) {
      var blocks = app.querySelectorAll(".chapter-edit-block, #honbun .section, main .section");
      target = blocks[item.idx] || null;
    }
    if (!target) return;
    try {
      var top = target.getBoundingClientRect().top + (window.pageYOffset || 0) - 12;
      window.scrollTo({ top: Math.max(0, top), behavior: "smooth" });
    } catch (err) {
      try { target.scrollIntoView({ behavior: "smooth", block: "start" }); } catch (e2) {}
    }
    // 軽いハイライト
    try {
      target.classList.add("is-jump-target");
      setTimeout(function () { target.classList.remove("is-jump-target"); }, 1600);
    } catch (err) {}
  }

  function bindSidebarNavActions() {
    if (!siteSidebarNav) return;
    siteSidebarNav.querySelectorAll("[data-action]").forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.preventDefault();
        e.stopPropagation();
        var act = btn.getAttribute("data-action");

        // 目次パネル内操作はサイドバーを閉じない
        if (act === "toc") {
          showSidebarChapterList();
          return;
        }
        if (act === "toc-back") {
          rebuildSidebarNav();
          return;
        }
        if (act === "jump-chapter") {
          var item = btn._chapterItem;
          if (!item) {
            item = {
              idx: Number(btn.getAttribute("data-chapter-idx")),
              id: btn.getAttribute("data-chapter-id") || "",
              title: (btn.textContent || "").trim()
            };
          }
          closeSidebar();
          setTimeout(function () { jumpToWorkChapter(item); }, 50);
          return;
        }
        if (act === "add-break") {
          closeSidebar();
          setTimeout(function () { insertSceneBreakAtCursor(); }, 40);
          return;
        }

        closeSidebar();
        if (act === "page-top") {
          window.scrollTo({ top: 0, behavior: "smooth" });
        } else if (act === "home") {
          location.hash = "#/";
        } else if (act === "work") {
          var wid = btn.getAttribute("data-work-id");
          if (wid) location.hash = "#/work/" + encodeURIComponent(wid);
        } else if (act === "save-work") {
          saveCurrentWorkEdits();
        } else if (act === "login") {
          openLoginModal();
        } else if (act === "toggle-manage") {
          setManageMode(!manageMode);
          if (cache) render();
        } else if (act === "secret-guide") {
          openSecretGuideModal();
        } else if (act === "logout") {
          if (window.confirm("ログアウトしますか？")) logout();
        } else if (act === "factor") {
          openFactorTraderGame();
        }
      });
    });
  }

  /* ===== 管理: 汎用フォームモーダル ===== */
  function openFormModal(title, fields, onSave) {

      }

  /* ===== 公開作品（掲載順）・傾向比率の自動算出 ===== */
  function getPublishedWorksOrdered(data) {
    var works = (data && data.works) || (cache && cache.works) || [];
    return works
      .filter(function (w) { return w && w.published !== false && !w.secret; })
      .slice()
      .sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
  }

  /** 掲載順に基づく WORK ラベル（例: WORK I）。list 省略時は公開作品一覧 */
  function workLabelFromOrder(w, list) {
    if (!w) return "";
    var arr = list || getPublishedWorksOrdered(cache || {});
    var idx = -1;
    for (var i = 0; i < arr.length; i++) {
      if (arr[i].id === w.id) { idx = i; break; }
    }
    return idx >= 0 ? ("WORK " + toRoman(idx + 1)) : "";
  }

  /**
   * 特徴レーダー values の作品平均から傾向比率（円グラフ）を自動算出。
   * 各軸の平均を正規化して合計100%にする。補足文も生成する。
   */
  function computePieFromRadar(data) {
    var radar = (data && data.radar) || DEFAULT_RADAR;
    var axes = radar.axes || [];
    var workIds = radar.workIds || [];
    var values = radar.values || {};
    var PIE_COLORS = ["#c4b8a8", "#8a837a", "#4a4845", "#6b7c6e", "#9a8b7a", "#5c6a7a", "#a89080"];

    if (!axes.length) {
      return { pie: [], pieNote: "特徴レーダーの軸が未設定のため、傾向比率を算出できません。" };
    }

    // レーダーに載っている作品のうち、数値が入っているものだけ平均に使う
    var usedIds = workIds.filter(function (id) {
      var v = values[id];
      if (!v) return false;
      return axes.some(function (ax) { return Number(v[ax.id]) > 0; });
    });
    // レーダー未選択なら公開作品から数値があるものを使う
    if (!usedIds.length) {
      var pub = getPublishedWorksOrdered(data);
      usedIds = pub.map(function (w) { return w.id; }).filter(function (id) {
        var v = values[id];
        if (!v) return false;
        return axes.some(function (ax) { return Number(v[ax.id]) > 0; });
      });
    }

    var avgs = axes.map(function (ax) {
      if (!usedIds.length) return 0;
      var sum = 0;
      usedIds.forEach(function (id) {
        var v = values[id] || {};
        sum += Number(v[ax.id] || 0);
      });
      return sum / usedIds.length;
    });

    var total = avgs.reduce(function (s, n) { return s + n; }, 0);
    var pie = axes.map(function (ax, i) {
      var pct = total > 0 ? Math.round((avgs[i] / total) * 100) : 0;
      return {
        label: ax.label || ("軸" + (i + 1)),
        percent: pct,
        color: PIE_COLORS[i % PIE_COLORS.length],
        axisId: ax.id
      };
    });
    // 丸め誤差で合計が100にならない場合は最大値に差分を寄せる
    if (pie.length && total > 0) {
      var sumPct = pie.reduce(function (s, p) { return s + p.percent; }, 0);
      var diff = 100 - sumPct;
      if (diff !== 0) {
        var maxI = 0;
        for (var j = 1; j < pie.length; j++) {
          if (pie[j].percent > pie[maxI].percent) maxI = j;
        }
        pie[maxI].percent = Math.max(0, pie[maxI].percent + diff);
      }
    }

    var axisNames = axes.map(function (ax) { return ax.label || ""; }).filter(Boolean).join(" / ");
    var top = pie.slice().sort(function (a, b) { return b.percent - a.percent; })[0];
    var nWorks = usedIds.length;
    var pieNote;
    if (!nWorks) {
      pieNote = "特徴レーダーに数値が入っている作品がまだないため、傾向比率は表示用の仮値です。レーダー編集で各作品の値を設定すると自動で反映されます。";
    } else {
      pieNote = "特徴レーダーの各軸（" + axisNames + "）について、対象" + nWorks +
        "作品の平均値を正規化した比率です。" +
        (top ? ("最も高いのは「" + top.label + "」（" + top.percent + "%）です。") : "");
    }
    return { pie: pie, pieNote: pieNote };
  }

  /* ===== 傾向比率：円グラフSVG生成 ===== */
  function buildPieSVG(segments) {
    segments = (segments || []).filter(function (s) { return Number(s.percent) > 0; });
    if (!segments.length) {
      return '<svg class="luna-pie-svg" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="50" fill="#2a2a2e"/></svg>';
    }
    var total = segments.reduce(function (sum, s) { return sum + Number(s.percent || 0); }, 0);
    if (total <= 0) total = 1;
    var svg = '<svg class="luna-pie-svg" viewBox="0 0 100 100" aria-hidden="true">';
    if (segments.length === 1) {
      svg += '<circle cx="50" cy="50" r="50" fill="' + esc(segments[0].color || "#c4b8a8") + '"/>';
      svg += "</svg>";
      return svg;
    }
    var startDeg = 0; // from top, clockwise
    function polar(deg) {
      var a = ((-90 + deg) * Math.PI) / 180;
      return { x: 50 + 50 * Math.cos(a), y: 50 + 50 * Math.sin(a) };
    }
    segments.forEach(function (s) {
      var sweep = (Number(s.percent || 0) / total) * 360;
      var endDeg = startDeg + sweep;
      var p0 = polar(startDeg);
      var p1 = polar(endDeg);
      var large = sweep > 180 ? 1 : 0;
      svg += '<path d="M50,50 L' + p0.x.toFixed(2) + "," + p0.y.toFixed(2) +
        " A50,50 0 " + large + ",1 " + p1.x.toFixed(2) + "," + p1.y.toFixed(2) +
        ' Z" fill="' + esc(s.color || "#888") + '"/>';
      startDeg = endDeg;
    });
    svg += "</svg>";
    return svg;
  }

  /* ===== 特徴レーダーチャート：表示用SVG生成 ===== */
  function buildRadarSVG(axes, works, values, activeId, PALETTE) {
    var W = 520, H = 520, cx = W / 2, cy = H / 2, R = Math.min(W, H) / 2 - 70;
    function angleFor(i) { return -Math.PI / 2 + i * (2 * Math.PI / axes.length); }
    function ptFor(i, val) {
      var r = (Math.max(0, Math.min(100, val || 0)) / 100) * R;
      var a = angleFor(i);
      return (cx + r * Math.cos(a)) + "," + (cy + r * Math.sin(a));
    }
    var svg = '<svg class="wmap-radar-svg" viewBox="0 0 ' + W + ' ' + H + '" width="100%">';
    [0.25, 0.5, 0.75, 1].forEach(function (r) {
      var poly = axes.map(function (_, i) {
        var a = angleFor(i);
        return (cx + R * r * Math.cos(a)) + "," + (cy + R * r * Math.sin(a));
      }).join(" ");
      svg += '<polygon points="' + poly + '" class="wmap-radar-ring"></polygon>';
    });
    axes.forEach(function (ax, i) {
      var a = angleFor(i);
      var lx = cx + (R + 22) * Math.cos(a), ly = cy + (R + 22) * Math.sin(a);
      svg += '<line x1="' + cx + '" y1="' + cy + '" x2="' + (cx + R * Math.cos(a)) + '" y2="' + (cy + R * Math.sin(a)) + '" class="wmap-radar-spoke"></line>';
      svg += '<text x="' + lx + '" y="' + ly + '" class="wmap-radar-axis-label" text-anchor="middle">' + esc(ax.label || "") + '</text>';
    });
    works.forEach(function (w, si) {
      if (activeId && activeId !== w.id) return;
      var vals = (values || {})[w.id] || {};
      var poly = axes.map(function (ax, i) { return ptFor(i, vals[ax.id]); }).join(" ");
      var color = PALETTE[si % PALETTE.length];
      svg += '<polygon points="' + poly + '" fill="' + color + '" fill-opacity="' + (activeId ? 0.22 : 0.12) + '" stroke="' + color + '" stroke-width="' + (activeId ? 2.2 : 1.4) + '"></polygon>';
    });
    svg += '</svg>';
    return svg;
  }

  var RADAR_PALETTE = ["#c8a86a", "#8b5cf6", "#f59e0b", "#38bdf8", "#f87171", "#4ade80", "#f472b6"];

  /* ===== 台詞・地の文抽出（作品単体） ===== */
  // 台詞: 「」内。地の文: 会話を含まないひとまとまりの段落で150文字以上（上限なし）。
  // 会話間の短い地の文や、会話をまたぐ結合は候補にしない。
  var TENSEN_DIALOGUE_MIN = 25;
  var TENSEN_DIALOGUE_MAX = Infinity;
  var TENSEN_NARRATION_MIN = 150;
  var TENSEN_SPEECH_TAG_RE = /^と[、,]?[^「」、,]{0,6}(は|が|も)?[、,]?(言|答え|呟|囁|叫|笑|頷|聞|尋|告げ|呼びかけ|怒鳴|漏ら|零し|返し|問|思|考え|感じ)[^「」]{0,10}[。.]?$/;
  var TENSEN_SHORT_SPEECH_TAG_RE = /^(と[^\n]{0,20}(言|答え|呟|囁|叫|笑|頷|返|問)[^\n]{0,8}[。.]?|と[^\n]{0,12}[。.]?)$/;
  function isTenSenSpeechTagOnly(text) {
    if (!text || text.length > 30) return false;
    return TENSEN_SPEECH_TAG_RE.test(text) || TENSEN_SHORT_SPEECH_TAG_RE.test(text);
  }
  function sampleTenSenN(arr, n) {
    if (!arr || arr.length <= n) return (arr || []).slice();
    var pool = arr.slice();
    var result = [];
    for (var i = 0; i < n; i++) {
      var idx = Math.floor(Math.random() * pool.length);
      result.push(pool[idx]);
      pool.splice(idx, 1);
    }
    return result;
  }
  function extractTenSenFromWork(work) {
    var narration = [];
    var dialogue = [];
    var tmp = document.createElement("div");
    tmp.innerHTML = work && work.content ? work.content : "";
    // 目次・見出しは除外
    tmp.querySelectorAll("#toc, .toc, h1, h2, h3, nav, script, style").forEach(function (el) {
      if (el.parentNode) el.parentNode.removeChild(el);
    });
    var blocks = tmp.querySelectorAll("p, .chapter-edit-body p, li");
    if (!blocks.length) {
      var plain = (tmp.textContent || "").replace(/\r\n/g, "\n").replace(/\r/g, "\n");
      plain.split(/\n+/).forEach(function (line) {
        line = line.trim();
        if (!line) return;
        processTenSenBlock(line, work, narration, dialogue);
      });
    } else {
      Array.prototype.forEach.call(blocks, function (el) {
        var line = (el.textContent || "").replace(/\s+/g, " ").trim();
        if (!line) return;
        processTenSenBlock(line, work, narration, dialogue);
      });
    }
    return { narration: narration, dialogue: dialogue };
  }
  function processTenSenBlock(line, work, narration, dialogue) {
    var quoteRe = /「([^「」]*)」/g;
    var m;
    var hasQuote = false;
    while ((m = quoteRe.exec(line))) {
      hasQuote = true;
      var q = (m[1] || "").trim();
      if (q.length >= TENSEN_DIALOGUE_MIN && q.length <= TENSEN_DIALOGUE_MAX) {
        dialogue.push({ text: "「" + q + "」", workTitle: work.title || "", workId: work.id || "" });
      }
    }
    // 地の文: 会話を一切含まない段落のみ（会話跨ぎ・会話間の断片を除外）
    if (!hasQuote) {
      if (line.length >= TENSEN_NARRATION_MIN && !isTenSenSpeechTagOnly(line)) {
        narration.push({ text: line, workTitle: work.title || "", workId: work.id || "" });
      }
    }
  }

  /* ===== 特徴レーダー：独立ページ ===== */
  /** 回答スコア → 0〜100 の傾向パーセント */
  function normalizeQuizScores(raw, axes) {
    var maxAbs = 0;
    axes.forEach(function (ax) {
      var v = Math.abs(raw[ax.id] || 0);
      if (v > maxAbs) maxAbs = v;
    });
    if (maxAbs < 1) maxAbs = 1;
    var out = {};
    axes.forEach(function (ax) {
      var v = raw[ax.id] || 0;
      // 0〜100 に正規化（相対強度）
      out[ax.id] = Math.round(Math.max(0, Math.min(100, (v / maxAbs) * 100)));
    });
    return out;
  }

  /** ユーザー傾向とレーダー数値の近さ（高いほど近い） */
  function quizWorkSimilarity(userPct, workVals, axes) {
    if (!axes.length) return 0;
    var sum = 0;
    var n = 0;
    axes.forEach(function (ax) {
      var u = userPct[ax.id];
      if (u === undefined) return;
      var w = workVals && workVals[ax.id];
      if (w === undefined || w === null) w = 50;
      // 距離を類似度に変換
      sum += 100 - Math.min(100, Math.abs(u - Number(w)));
      n += 1;
    });
    return n ? sum / n : 0;
  }

  function quizLevelWord(v) {
    v = Number(v) || 0;
    if (v >= 85) return "きわめて強い";
    if (v >= 70) return "強い";
    if (v >= 55) return "はっきりした";
    if (v >= 40) return "中程度の";
    if (v >= 25) return "控えめな";
    return "ほとんど求めない";
  }

  /** 診断結果：全体の傾向プロフィール文 */
  function buildQuizTendencyProfile(userPct, axes) {
    var rows = (axes || []).map(function (ax) {
      return { label: ax.label || ax.id, u: userPct[ax.id] || 0 };
    }).sort(function (a, b) { return b.u - a.u; });
    if (!rows.length) return "";
    var top = rows.filter(function (r) { return r.u >= 55; });
    if (!top.length) top = rows.slice(0, Math.min(2, rows.length));
    var low = rows.filter(function (r) { return r.u < 30; });

    var text = "「" + top.map(function (r) { return r.label + " " + r.u + "%"; }).join("、") +
      "」が強く、ここを軸に作品を選びやすい傾向です。";
    if (low.length) {
      text += "「" + low.map(function (r) { return r.label; }).join("・") + "」は相対的に控えめです。";
    }
    return text;
  }

  /** 1作品ごとの推薦理由（簡潔） */
  function buildQuizWorkAnalysis(userPct, item, axes) {
    var title = item.work.title || "この作品";
    var rows = (axes || []).map(function (ax) {
      var u = userPct[ax.id] || 0;
      var wv = item.vals[ax.id];
      if (wv === undefined || wv === null) wv = 50;
      wv = Math.round(Number(wv));
      return { label: ax.label || ax.id, u: u, w: wv, gap: Math.abs(u - wv) };
    });
    var bothHigh = rows.filter(function (r) { return r.u >= 55 && r.w >= 55; })
      .sort(function (a, b) { return (b.u + b.w) - (a.u + a.w); });
    var close = rows.slice().sort(function (a, b) { return a.gap - b.gap; });
    var byUser = rows.slice().sort(function (a, b) { return b.u - a.u; });
    var far = rows.filter(function (r) { return r.gap >= 40; })
      .sort(function (a, b) { return b.gap - a.gap; });
    var sim = Math.round(item.sim);

    var parts = [];
    if (sim >= 70) {
      parts.push("「" + title + "」は全体の型がよく合います（適合 " + sim + "%）。");
    } else if (sim >= 50) {
      parts.push("「" + title + "」は主軸のいくつかで噛み合います（適合 " + sim + "%）。");
    } else {
      parts.push("「" + title + "」は部分的に接点があります（適合 " + sim + "%）。");
    }

    if (bothHigh.length) {
      var bh = bothHigh.slice(0, 2);
      parts.push(
        "共鳴点は" +
        bh.map(function (r) { return "「" + r.label + "」（あなた" + r.u + "%／作品" + r.w + "）"; }).join("、") +
        "。"
      );
    } else if (close[0] && close[0].gap <= 25) {
      var c = close[0];
      parts.push("いちばん近いのは「" + c.label + "」（あなた" + c.u + "%／作品" + c.w + "）。");
    }

    if (byUser[0] && byUser[0].u >= 60) {
      var t = byUser[0];
      if (t.w >= 55 && t.gap <= 30) {
        parts.push("最重視の「" + t.label + "」を作品側も十分に持っています。");
      } else if (t.gap > 35) {
        parts.push("最重視の「" + t.label + "」は作品側" + t.w + "と差があるため、そこだけを本命にしない方がよいです。");
      }
    }

    if (far[0] && parts.length < 3) {
      var f = far[0];
      if (f.u < f.w) {
        parts.push("「" + f.label + "」は作品の方が厚く、副次的な味わいとして受け取る想定が合います。");
      }
    }

    return parts.join("");
  }

  function buildQuizRecommendations(userPct, data, quiz) {
    var axes = quiz.axes || [];
    var radar = data.radar || DEFAULT_RADAR;
    var byId = {};
    (data.works || []).forEach(function (w) { byId[w.id] = w; });
    var candidates = (radar.workIds || []).map(function (id) { return byId[id]; }).filter(function (w) {
      return w && isWorkVisible(w);
    });
    // レーダー未登録なら公開作品全体
    if (!candidates.length) {
      candidates = (data.works || []).filter(function (w) { return isWorkVisible(w); });
    }
    var scored = candidates.map(function (w) {
      var vals = (radar.values && radar.values[w.id]) || {};
      var sim = quizWorkSimilarity(userPct, vals, axes);
      return { work: w, sim: sim, vals: vals };
    });
    scored.sort(function (a, b) { return b.sim - a.sim; });
    var count = Math.max(1, Math.min(5, Number(quiz.recommendCount) || 3));
    var profile = buildQuizTendencyProfile(userPct, axes);
    return {
      profile: profile,
      items: scored.slice(0, count).map(function (item, idx) {
        var reason = buildQuizWorkAnalysis(userPct, item, axes);
        var basis = "適合度 " + Math.round(item.sim) + "% ｜ " +
          axes.map(function (ax) {
            var u = userPct[ax.id] || 0;
            var wv = item.vals[ax.id];
            if (wv === undefined) wv = "—";
            else wv = Math.round(Number(wv));
            return (ax.label || ax.id) + " " + u + "/" + wv;
          }).join(" · ");
        return {
          rank: idx + 1,
          work: item.work,
          sim: item.sim,
          reason: reason,
          basis: basis
        };
      })
    };
  }

        if (overview.timelineSummary) {

        }
        html += "</section>";

      // 傾向比率は特徴レーダーの作品平均から毎回自動算出
      var computedPie = computePieFromRadar(data);
      var pieSegs = computedPie.pie || [];
      var pieNoteAuto = computedPie.pieNote || "";
      if (pieSegs.length) {
        html += '<section class="luna-overview-section" id="tendency-section">';

          var p = resultPct[ax.id] || 0;

            '<span class="quiz-axis-label">' + esc(ax.label || ax.id) + "</span>" +
