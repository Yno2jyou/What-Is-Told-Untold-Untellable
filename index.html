      if (startBtn) startBtn.addEventListener("click", function () {
        quizPhase = "asking";
        qIndex = 0;
        rawScores = {};
        (quiz.axes || []).forEach(function (ax) { rawScores[ax.id] = 0; });
        resultPct = null;
        recommendations = { profile: "", items: [] };
        paint();
        var sec = document.getElementById("quiz-section");
        if (sec) sec.scrollIntoView({ behavior: "smooth", block: "start" });
      });

      app.querySelectorAll("[data-choice-id]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var cid = btn.getAttribute("data-choice-id");
          var cur = (quiz.questions || [])[qIndex];
          if (!cur) return;
          var choice = (cur.choices || []).filter(function (c) { return c.id === cid; })[0];
          if (choice && choice.scores) {
            Object.keys(choice.scores).forEach(function (aid) {
              rawScores[aid] = (rawScores[aid] || 0) + Number(choice.scores[aid] || 0);
            });
          }
          if (qIndex + 1 >= (quiz.questions || []).length) {
            resultPct = normalizeQuizScores(rawScores, quiz.axes || []);
            recommendations = buildQuizRecommendations(resultPct, data, quiz);
            quizPhase = "result";
            paint();
            // バーアニメーション
            requestAnimationFrame(function () {
              app.querySelectorAll(".quiz-axis-fill").forEach(function (el) {
                var v = el.getAttribute("data-fill") || "0";
                el.style.width = v + "%";
              });
            });
            var sec2 = document.getElementById("quiz-section");
            if (sec2) sec2.scrollIntoView({ behavior: "smooth", block: "start" });
          } else {
            qIndex += 1;
            paint();
          }
        });
      });

      var againBtn = app.querySelector("[data-quiz-again]");
      if (againBtn) againBtn.addEventListener("click", function () {
        quizPhase = "intro";
        qIndex = 0;
        rawScores = {};
        (quiz.axes || []).forEach(function (ax) { rawScores[ax.id] = 0; });
        resultPct = null;
        recommendations = { profile: "", items: [] };
        paint();
      });
    }
    paint();
  }

  function openRadarEditModal(data) {
    var draft = JSON.parse(JSON.stringify(data.radar || DEFAULT_RADAR));
    if (!draft.axes) draft.axes = [];
    if (!draft.workIds) draft.workIds = [];
    if (!draft.values) draft.values = {};

    var existing = document.querySelector(".modal-overlay.radar-edit-overlay");
    if (existing) existing.remove();
    var overlay = document.createElement("div");
    overlay.className = "modal-overlay radar-edit-overlay";
    var box = document.createElement("div");
    box.className = "modal-box radar-edit-modal";
    box.style.maxWidth = "680px";
    box.style.maxHeight = "84vh";
    box.style.overflowY = "auto";
    overlay.appendChild(box);
    document.body.appendChild(overlay);

    function uid() { return "a" + Math.random().toString(36).slice(2, 8); }

    function render() {
      var html = "<h3>特徴レーダーを編集</h3>";
      html += '<label>セクションタイトル</label>';
      html += '<input type="text" data-field="title" value="' + esc(draft.title || "") + '" style="width:100%;background:#050406;border:1px solid var(--line);color:var(--fg);padding:8px 10px;font-family:var(--font-body);font-size:13px;margin-bottom:12px;" />';
      html += '<label>補足説明</label>';
      html += '<textarea data-field="desc" rows="2" style="width:100%;background:#050406;border:1px solid var(--line);color:var(--fg);padding:8px 10px;font-family:var(--font-body);font-size:13px;margin-bottom:16px;">' + esc(draft.desc || "") + '</textarea>';

      html += '<div style="display:flex;align-items:center;justify-content:space-between;margin:16px 0 8px;"><strong style="font-size:13px;">テーマ軸（' + draft.axes.length + '）</strong><button class="btn" data-add-axis type="button">＋ 軸を追加</button></div>';
      if (!draft.axes.length) {
        html += '<p style="font-size:12px;opacity:.7;">まだ軸が登録されていません（3つ以上を推奨）</p>';
      } else {
        draft.axes.forEach(function (ax) {
          html += '<div style="display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);">' +
            '<input type="text" data-axis-label="' + esc(ax.id) + '" value="' + esc(ax.label || "") + '" placeholder="軸の名前" style="flex:1;background:#050406;border:1px solid var(--line);color:var(--fg);padding:6px 8px;font-size:13px;" />' +
            '<button class="btn" data-del-axis="' + esc(ax.id) + '" type="button">削除</button>' +
            '</div>';
        });
      }

      html += '<div style="margin:20px 0 8px;"><strong style="font-size:13px;">表示する作品（' + draft.workIds.length + '）</strong></div>';
      (data.works || []).forEach(function (w) {
        var checked = draft.workIds.indexOf(w.id) !== -1;
        html += '<label style="display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px;">' +
          '<input type="checkbox" data-toggle-work="' + esc(w.id) + '"' + (checked ? " checked" : "") + ' /> ' + esc(w.title) +
          '</label>';
      });

      if (draft.workIds.length && draft.axes.length) {
        html += '<div style="margin-top:20px;overflow-x:auto;"><strong style="font-size:13px;">各作品の数値（0〜100）</strong>';
        html += '<table style="width:100%;border-collapse:collapse;margin-top:8px;">';
        html += '<thead><tr><th style="text-align:left;font-size:11px;padding:6px;border-bottom:1px solid var(--line);">作品</th>';
        draft.axes.forEach(function (ax) { html += '<th style="text-align:left;font-size:11px;padding:6px;border-bottom:1px solid var(--line);">' + esc(ax.label || "軸") + '</th>'; });
        html += '</tr></thead><tbody>';
        draft.workIds.forEach(function (wid) {
          var w = (data.works || []).filter(function (x) { return x.id === wid; })[0];
          if (!w) return;
          html += '<tr><td style="padding:6px;font-size:12px;white-space:nowrap;">' + esc(w.title) + '</td>';
          draft.axes.forEach(function (ax) {
            var v = (draft.values[wid] || {})[ax.id];
            if (v === undefined) v = 50;
            html += '<td style="padding:6px;min-width:130px;"><input type="range" min="0" max="100" value="' + v + '" data-value-work="' + esc(wid) + '" data-value-axis="' + esc(ax.id) + '" style="width:90px;vertical-align:middle;" /> <span style="font-size:11px;">' + v + '</span></td>';
          });
          html += '</tr>';
        });
        html += '</tbody></table></div>';
      }

      html += '<div class="modal-actions" style="margin-top:20px;"><button class="btn" data-close type="button">キャンセル</button><button class="btn primary" data-save type="button">保存</button></div>';
      box.innerHTML = html;
      bind();
    }

    function bind() {
      box.querySelector("[data-close]").addEventListener("click", close);
      box.querySelector('[data-field="title"]').addEventListener("input", function () { draft.title = this.value; });
      box.querySelector('[data-field="desc"]').addEventListener("input", function () { draft.desc = this.value; });
      box.querySelector("[data-add-axis]").addEventListener("click", function () {
        draft.axes.push({ id: uid(), label: "新しい軸" });
        render();
      });
      box.querySelectorAll("[data-del-axis]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var id = btn.getAttribute("data-del-axis");
          draft.axes = draft.axes.filter(function (a) { return a.id !== id; });
          Object.keys(draft.values).forEach(function (wid) {
            if (draft.values[wid]) delete draft.values[wid][id];
          });
          render();
        });
      });
      box.querySelectorAll("[data-axis-label]").forEach(function (input) {
        input.addEventListener("change", function () {
          var id = input.getAttribute("data-axis-label");
          var ax = draft.axes.filter(function (a) { return a.id === id; })[0];
          if (ax) ax.label = input.value;
        });
      });
      box.querySelectorAll("[data-toggle-work]").forEach(function (cb) {
        cb.addEventListener("change", function () {
          var id = cb.getAttribute("data-toggle-work");
          var idx = draft.workIds.indexOf(id);
          if (cb.checked && idx === -1) draft.workIds.push(id);
          else if (!cb.checked && idx !== -1) draft.workIds.splice(idx, 1);
          render();
        });
      });
      box.querySelectorAll("[data-value-work]").forEach(function (range) {
        range.addEventListener("input", function () {
          var wid = range.getAttribute("data-value-work");
          var aid = range.getAttribute("data-value-axis");
          if (!draft.values[wid]) draft.values[wid] = {};
          draft.values[wid][aid] = Number(range.value);
          var label = range.nextElementSibling;
          if (label) label.textContent = range.value;
        });
      });
      box.querySelector("[data-save]").addEventListener("click", async function () {
        var saveBtn = box.querySelector("[data-save]");
        saveBtn.textContent = "保存中...";
        saveBtn.disabled = true;
        try {
          await saveRadar(draft);
          close();
          await refresh();
        } catch (e) {
          alert("保存に失敗しました: " + (e && e.message ? e.message : e));
          saveBtn.textContent = "保存";
          saveBtn.disabled = false;
        }
      });
    }
    function close() { if (overlay.parentNode) overlay.parentNode.removeChild(overlay); }
    overlay.addEventListener("click", function (e) { if (e.target === overlay) close(); });
    render();
  }

          '<input type="text" data-axis-label="' + esc(ax.id) + '" value="' + esc(ax.label || "") + '" placeholder="表示名" style="flex:1;background:#050406;border:1px solid var(--line);color:var(--fg);padding:6px 8px;font-size:13px;" />' +
          '<button class="btn" data-del-axis="' + esc(ax.id) + '" type="button">削除</button></div>';

        html += '<p style="font-size:12px;opacity:.7;">まだ質問がありません（10問前後を推奨）</p>';
      }
      draft.questions.forEach(function (q, qi) {

          '<button class="btn" data-del-q="' + qi + '" type="button">質問を削除</button></div>';

    function bind() {
      box.querySelector("[data-close]").addEventListener("click", close);
      box.querySelector('[data-field="title"]').addEventListener("input", function () { draft.title = this.value; });
      box.querySelector('[data-field="desc"]').addEventListener("input", function () { draft.desc = this.value; });
      box.querySelector('[data-field="startLabel"]').addEventListener("input", function () { draft.startLabel = this.value; });
      box.querySelector('[data-field="recommendCount"]').addEventListener("change", function () {
        var n = parseInt(this.value, 10);
        if (isNaN(n) || n < 1) n = 1;
        if (n > 5) n = 5;
        draft.recommendCount = n;
        this.value = String(n);
      });

      box.querySelector("[data-add-axis]").addEventListener("click", function () {
        draft.axes.push({ id: uid("a"), label: "新しい軸" });
        render();
      });
      box.querySelectorAll("[data-del-axis]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var id = btn.getAttribute("data-del-axis");
          draft.axes = draft.axes.filter(function (a) { return a.id !== id; });
          (draft.questions || []).forEach(function (q) {
            (q.choices || []).forEach(function (ch) {
              if (ch.scores) delete ch.scores[id];
            });
          });
          render();
        });
      });
      box.querySelectorAll("[data-axis-label]").forEach(function (input) {
        input.addEventListener("change", function () {
          var id = input.getAttribute("data-axis-label");
          var ax = draft.axes.filter(function (a) { return a.id === id; })[0];
          if (ax) ax.label = input.value;
        });
      });
      box.querySelectorAll("[data-axis-id]").forEach(function (input) {
        input.addEventListener("change", function () {
          var oldId = input.getAttribute("data-axis-id");
          var newId = (input.value || "").trim() || oldId;
          if (newId === oldId) return;
          var ax = draft.axes.filter(function (a) { return a.id === oldId; })[0];
          if (!ax) return;
          ax.id = newId;
          (draft.questions || []).forEach(function (q) {
            (q.choices || []).forEach(function (ch) {
              if (ch.scores && oldId in ch.scores) {
                ch.scores[newId] = ch.scores[oldId];
                delete ch.scores[oldId];
              }
            });
          });
          render();
        });
      });

      box.querySelector("[data-add-q]").addEventListener("click", function () {
        draft.questions.push({
          id: uid("q"),
          text: "新しい質問",
          choices: [
            { id: uid("c"), label: "選択肢A", scores: {} },
            { id: uid("c"), label: "選択肢B", scores: {} }
          ]
        });
        render();
      });
      box.querySelectorAll("[data-del-q]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var qi = Number(btn.getAttribute("data-del-q"));
          draft.questions.splice(qi, 1);
          render();
        });
      });
      box.querySelectorAll("[data-q-text]").forEach(function (ta) {
        ta.addEventListener("input", function () {
          var qi = Number(ta.getAttribute("data-q-text"));
          if (draft.questions[qi]) draft.questions[qi].text = ta.value;
        });
      });
      box.querySelectorAll("[data-add-ch]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var qi = Number(btn.getAttribute("data-add-ch"));
          if (!draft.questions[qi].choices) draft.questions[qi].choices = [];
          draft.questions[qi].choices.push({ id: uid("c"), label: "新しい選択肢", scores: {} });
          render();
        });
      });
      box.querySelectorAll("[data-del-ch]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var parts = btn.getAttribute("data-del-ch").split("-");
          var qi = Number(parts[0]);
          var ci = Number(parts[1]);
          if (draft.questions[qi] && draft.questions[qi].choices) {
            draft.questions[qi].choices.splice(ci, 1);
            render();
          }
        });
      });
      box.querySelectorAll("[data-ch-label]").forEach(function (input) {
        input.addEventListener("input", function () {
          var parts = input.getAttribute("data-ch-label").split("-");
          var qi = Number(parts[0]);
          var ci = Number(parts[1]);
          if (draft.questions[qi] && draft.questions[qi].choices[ci]) {
            draft.questions[qi].choices[ci].label = input.value;
          }
        });
      });
      box.querySelectorAll("[data-ch-score]").forEach(function (input) {
        input.addEventListener("change", function () {
          var parts = input.getAttribute("data-ch-score").split("-");
          var qi = Number(parts[0]);
          var ci = Number(parts[1]);
          var aid = parts.slice(2).join("-");
          if (!draft.questions[qi] || !draft.questions[qi].choices[ci]) return;
          if (!draft.questions[qi].choices[ci].scores) draft.questions[qi].choices[ci].scores = {};
          var n = parseInt(input.value, 10);
          if (isNaN(n) || n < 0) n = 0;
          draft.questions[qi].choices[ci].scores[aid] = n;
          input.value = String(n);
        });
      });

      box.querySelector("[data-save]").addEventListener("click", async function () {
        var saveBtn = box.querySelector("[data-save]");
        saveBtn.textContent = "保存中...";
        saveBtn.disabled = true;
        try {
          await saveQuiz(draft);
          close();
          await refresh();
        } catch (e) {
          alert("保存に失敗しました: " + (e && e.message ? e.message : e));
          saveBtn.textContent = "保存";
          saveBtn.disabled = false;
        }
      });
    }
    function close() { if (overlay.parentNode) overlay.parentNode.removeChild(overlay); }
    overlay.addEventListener("click", function (e) { if (e.target === overlay) close(); });
    render();
  }

  function openOverviewEditModal(data) {
    var draft = JSON.parse(JSON.stringify(data.overview || DEFAULT_OVERVIEW));
    if (!draft.timeline) draft.timeline = [];
    if (!Array.isArray(draft.timeline)) draft.timeline = [];
    // pie はレーダーから自動算出するため、編集対象にしない
    var computed = computePieFromRadar(data);
    var pubOrdered = getPublishedWorksOrdered(data);

    var existing = document.querySelector(".modal-overlay.overview-edit-overlay");
    if (existing) existing.remove();
    var overlay = document.createElement("div");
    overlay.className = "modal-overlay overview-edit-overlay";
    var box = document.createElement("div");
    box.className = "modal-box radar-edit-modal";
    box.style.maxWidth = "720px";
    box.style.maxHeight = "86vh";
    box.style.overflowY = "auto";
    overlay.appendChild(box);
    document.body.appendChild(overlay);

    function resolveWorkId(item) {
      if (item.workId) {
        for (var i = 0; i < pubOrdered.length; i++) {
          if (pubOrdered[i].id === item.workId) return item.workId;
        }
      }
      if (item.title) {
        for (var j = 0; j < pubOrdered.length; j++) {
          if (pubOrdered[j].title === item.title) return pubOrdered[j].id;
        }
      }
      return "";
    }

    function render() {
      var html = "<h3>時間軸・傾向比率を編集</h3>";

      html += '<p style="font-size:12px;opacity:.7;margin:0 0 14px;">ようこそページに表示する「時間軸と作風の変遷」を編集します。傾向比率は特徴レーダーの平均値から自動算出されます。</p>';

      html += '<label>時間軸セクションタイトル</label>';
      html += '<input type="text" data-field="timelineTitle" value="' + esc(draft.timelineTitle || "") + '" style="width:100%;background:#050406;border:1px solid var(--line);color:var(--fg);padding:8px 10px;font-family:var(--font-body);font-size:13px;margin-bottom:12px;" />';

      html += '<div style="display:flex;align-items:center;justify-content:space-between;margin:8px 0 8px;"><strong style="font-size:13px;">タイムライン項目（' + draft.timeline.length + '）</strong><button class="btn" data-add-tl type="button">＋ 項目を追加</button></div>';
      html += '<p style="font-size:11px;opacity:.65;margin:0 0 10px;">作品名は公開作品から選択します。WORK ラベルは作品一覧の掲載順と自動で一致します。</p>';

      draft.timeline.forEach(function (item, idx) {
        var wid = resolveWorkId(item);
        item.workId = wid || item.workId || "";
        var linked = null;
        for (var i = 0; i < pubOrdered.length; i++) {
          if (pubOrdered[i].id === item.workId) { linked = pubOrdered[i]; break; }
        }
        var autoLabel = linked ? workLabelFromOrder(linked, pubOrdered) : (item.workLabel || "—");
        if (linked) {
          item.workLabel = autoLabel;
          item.title = linked.title || "";
        }

        html += '<div style="border:1px solid var(--line);border-radius:4px;padding:12px;margin-bottom:12px;background:rgba(255,255,255,0.02);">';
        html += '<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;">';
        html += '<strong style="font-size:12px;opacity:.7;flex:1;">#' + (idx + 1) + "</strong>";
        html += '<button class="btn" data-tl-up="' + idx + '" type="button"' + (idx === 0 ? " disabled" : "") + ">↑</button>";
        html += '<button class="btn" data-tl-down="' + idx + '" type="button"' + (idx === draft.timeline.length - 1 ? " disabled" : "") + ">↓</button>";
        html += '<button class="btn" data-del-tl="' + idx + '" type="button">削除</button>';
        html += "</div>";
        html += '<label style="font-size:11px;opacity:.7;">期間ラベル（空欄可・例：初期 · 実存の重み）</label>';
        html += '<input type="text" data-tl-period="' + idx + '" value="' + esc(item.period || "") + '" style="width:100%;background:#050406;border:1px solid var(--line);color:var(--fg);padding:6px 8px;font-size:13px;margin-bottom:8px;" />';

    function bind() {
      box.querySelector("[data-close]").addEventListener("click", close);

      ["timelineTitle", "timelineSummary", "pieTitle"].forEach(function (key) {
        var el = box.querySelector('[data-field="' + key + '"]');
        if (el) el.addEventListener("input", function () { draft[key] = this.value; });
      });

      var addTl = box.querySelector("[data-add-tl]");
      if (addTl) addTl.addEventListener("click", function () {
        draft.timeline.push({
          period: "",
          periodActive: false,
          workId: "",
          workLabel: "",
          title: "",
          desc: ""
        });
        render();
      });

      box.querySelectorAll("[data-del-tl]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var i = Number(btn.getAttribute("data-del-tl"));
          draft.timeline.splice(i, 1);
          render();
        });
      });
      box.querySelectorAll("[data-tl-up]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var i = Number(btn.getAttribute("data-tl-up"));
          if (i <= 0) return;
          var tmp = draft.timeline[i - 1];
          draft.timeline[i - 1] = draft.timeline[i];
          draft.timeline[i] = tmp;
          render();
        });
      });
      box.querySelectorAll("[data-tl-down]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var i = Number(btn.getAttribute("data-tl-down"));
          if (i >= draft.timeline.length - 1) return;
          var tmp = draft.timeline[i + 1];
          draft.timeline[i + 1] = draft.timeline[i];
          draft.timeline[i] = tmp;
          render();
        });
      });

      box.querySelectorAll("[data-tl-period]").forEach(function (input) {
        input.addEventListener("input", function () {
          var i = Number(input.getAttribute("data-tl-period"));
          if (draft.timeline[i]) draft.timeline[i].period = input.value;
        });
      });
      box.querySelectorAll("[data-tl-active]").forEach(function (cb) {
        cb.addEventListener("change", function () {
          var i = Number(cb.getAttribute("data-tl-active"));
          if (draft.timeline[i]) draft.timeline[i].periodActive = !!cb.checked;
        });
      });
      box.querySelectorAll("[data-tl-work]").forEach(function (sel) {
        sel.addEventListener("change", function () {
          var i = Number(sel.getAttribute("data-tl-work"));
          if (!draft.timeline[i]) return;
          var id = sel.value || "";
          draft.timeline[i].workId = id;
          var linked = null;
          for (var k = 0; k < pubOrdered.length; k++) {
            if (pubOrdered[k].id === id) { linked = pubOrdered[k]; break; }
          }
          if (linked) {
            draft.timeline[i].title = linked.title || "";
            draft.timeline[i].workLabel = workLabelFromOrder(linked, pubOrdered);
          } else {
            draft.timeline[i].title = "";
            draft.timeline[i].workLabel = "";
          }
          render();
        });
      });
      box.querySelectorAll("[data-tl-desc]").forEach(function (input) {
        input.addEventListener("input", function () {
          var i = Number(input.getAttribute("data-tl-desc"));
          if (draft.timeline[i]) draft.timeline[i].desc = input.value;
        });
      });

      box.querySelector("[data-save]").addEventListener("click", async function () {
        var saveBtn = box.querySelector("[data-save]");
        saveBtn.textContent = "保存中...";
        saveBtn.disabled = true;
        try {
          // 保存時もレーダー平均で pie / pieNote を同期
          var fresh = computePieFromRadar(data);
          draft.pie = fresh.pie;
          draft.pieNote = fresh.pieNote;
          // workLabel / title を公開一覧から再同期
          draft.timeline.forEach(function (item) {
            var linked = null;
            if (item.workId) {
              for (var i = 0; i < pubOrdered.length; i++) {
                if (pubOrdered[i].id === item.workId) { linked = pubOrdered[i]; break; }
              }
            }
            if (linked) {
              item.title = linked.title || "";
              item.workLabel = workLabelFromOrder(linked, pubOrdered);
            }
          });
          await saveOverview(draft);
          close();
          await refresh();
        } catch (e) {
          alert("保存に失敗しました: " + (e && e.message ? e.message : e));
          saveBtn.textContent = "保存";
          saveBtn.disabled = false;
        }
      });
    }

    function close() { if (overlay.parentNode) overlay.parentNode.removeChild(overlay); }
    overlay.addEventListener("click", function (e) { if (e.target === overlay) close(); });
    render();
  }

  function unwrapNestedMains(root) {
    var guard = 0;
    while (guard++ < 20) {
      var nested = root.querySelector("main");
      if (!nested) break;
      var frag = document.createDocumentFragment();
      while (nested.firstChild) frag.appendChild(nested.firstChild);
      nested.parentNode.replaceChild(frag, nested);
    }
  }

  /** 編集用に DOM をフラット化（見出し + 段落のみ）。選択・コピペが安定する */
  function flattenWorkDom(main) {
    unwrapNestedMains(main);
    var parts = [];
    var sections = main.querySelectorAll(".section");
    if (sections.length) {
      sections.forEach(function (sec) {
        var titleEl = sec.querySelector(".section-title");
        if (titleEl) {
          var t = (titleEl.textContent || "").trim();
          if (t) parts.push({ kind: "h2", text: t });
        }
        Array.prototype.forEach.call(sec.children, function (el) {
          if (el.tagName === "HR" || (el.classList && el.classList.contains("scene-break"))) {
            parts.push({ kind: "hr" });
            return;
          }
          if (el.tagName !== "P") return;
          var t = (el.textContent || "").trim();
          if (!t) return;
          parts.push({
            kind: "p",
            text: t,
            noIndent: el.classList.contains("no-indent")
          });
        });
      });
    } else {
      main.querySelectorAll("h2, p, hr.scene-break, hr").forEach(function (el) {
        if (el.tagName === "HR" || (el.classList && el.classList.contains("scene-break"))) {
          parts.push({ kind: "hr" });
          return;
        }
        var t = (el.textContent || "").trim();
        if (!t) return;
        if (el.tagName === "H2") parts.push({ kind: "h2", text: t });
        else parts.push({ kind: "p", text: t, noIndent: el.classList.contains("no-indent") });
      });
    }

    // あとがき
    var aw = main.querySelector(".afterword-content");
    if (aw) {
      var awTitle = aw.querySelector(".aw-title");
      parts.push({ kind: "h2", text: ((awTitle && awTitle.textContent) || "あとがき").trim() });
      Array.prototype.forEach.call(aw.children, function (el) {
        if (el.tagName === "HR" || (el.classList && el.classList.contains("scene-break"))) {
          parts.push({ kind: "hr" });
          return;
        }
        if (el.tagName !== "P") return;
        var t = (el.textContent || "").trim();
        if (t) parts.push({ kind: "p", text: t, noIndent: el.classList.contains("no-indent") });
      });
    }

    if (!parts.length) return;

    // 章ごとにブロック化：タイトルと本文を独立した contenteditable にするため
    var chapters = [];
    var current = null;
    function ensureChapter() {
      if (!current) current = { title: "", body: [] };
    }
    parts.forEach(function (part) {
      if (part.kind === "h2") {
        if (current) chapters.push(current);
        current = { title: part.text || "", body: [] };
      } else {
        ensureChapter();
        current.body.push(part);
      }
    });
    if (current) chapters.push(current);
    if (!chapters.length) chapters.push({ title: "", body: [] });

    var html = "";
    chapters.forEach(function (ch, i) {
      html += '<div class="chapter-edit-block" data-chapter-idx="' + i + '">\n';
      html += '  <h2 class="section-title chapter-edit-title" contenteditable="true" spellcheck="false">' +
        softBreakTitle(ch.title || ("第" + (i + 1) + "話")) + "</h2>\n";
      html += '  <div class="chapter-edit-body" contenteditable="true" spellcheck="false">\n';
      if (!ch.body.length) {
        html += '    <p>（ここに本文を書いてください）</p>\n';
      } else {
        ch.body.forEach(function (part) {
          if (part.kind === "hr") {
            html += '    <hr class="scene-break" />\n';
          } else {
            html += "    <p" + (part.noIndent ? ' class="no-indent"' : "") + ">" + esc(part.text) + "</p>\n";
          }
        });
      }
      html += "  </div>\n</div>\n";
    });
    main.innerHTML = html;
  }

  /** フラット DOM（章ブロック） → 保存用（目次・section 付き）HTML */
  function rebuildWorkHtmlFromFlat(main) {
    var chapters = [];
    var blocks = main.querySelectorAll(".chapter-edit-block");

    if (blocks.length) {
      blocks.forEach(function (block) {
        var titleEl = block.querySelector(".chapter-edit-title, h2.section-title");
        var bodyEl = block.querySelector(".chapter-edit-body");
        var title = titleEl ? (titleEl.textContent || "").trim() : "";
        var paras = [];
        if (bodyEl) {
          Array.prototype.forEach.call(bodyEl.children, function (el) {
            if (el.tagName === "HR" || (el.classList && el.classList.contains("scene-break"))) {
              paras.push({ sceneBreak: true });
              return;
            }
            if (el.tagName === "P") {
              var t = (el.textContent || "").trim();
              if (t) {
                paras.push({
                  text: t,
                  noIndent: el.classList.contains("no-indent") || /^[「『（(\[【─―—]/.test(t)
                });
              }
            } else {
              var t2 = (el.textContent || "").trim();
              if (t2) {
                paras.push({ text: t2, noIndent: /^[「『（(\[【─―—]/.test(t2) });
              }
            }
          });
        }
        chapters.push({ title: title, paras: paras });
      });
    } else {
      // 旧フラット構造のフォールバック
      var children = Array.prototype.slice.call(main.children);
      var current = { title: null, paras: [] };
      function pushCurrent() {
        if (current.title || current.paras.length) chapters.push(current);
        current = { title: null, paras: [] };
      }
      children.forEach(function (el) {
        if (el.tagName === "H2") {
          pushCurrent();
          current.title = (el.textContent || "").trim();
        } else if (el.tagName === "HR" || (el.classList && el.classList.contains("scene-break"))) {
          current.paras.push({ sceneBreak: true });
        } else if (el.tagName === "P") {
          var t = (el.textContent || "").trim();
          if (t) {
            current.paras.push({
              text: t,
              noIndent: el.classList.contains("no-indent") || /^[「『（(\[【─―—]/.test(t)
            });
          }
        } else {
          var t3 = (el.textContent || "").trim();
          if (t3) {
            current.paras.push({ text: t3, noIndent: /^[「『（(\[【─―—]/.test(t3) });
          }
        }
      });
      pushCurrent();
    }

    // テキストノードのみのゴミも拾う
    if (!chapters.length) {
      var raw = (main.textContent || "").trim();
      if (raw) chapters.push({ title: null, paras: [{ text: raw, noIndent: false }] });
    }

    var tocItems = [];
    var sectionsHtml = [];
    var afterwordHtml = "";
    var chIndex = 0;

    chapters.forEach(function (ch) {
      var title = ch.title || "";
      var isAfterword = /^あとがき/.test(title);
      var pHtml = ch.paras.map(function (p) {
        if (p.sceneBreak) return '<hr class="scene-break" />';
        return "<p" + (p.noIndent ? ' class="no-indent"' : "") + ">" + esc(p.text) + "</p>";
      }).join("\n    ");

      if (isAfterword) {
        afterwordHtml =
          '<div class="afterword-section">\n' +
          '  <button type="button" class="afterword-toggle" aria-expanded="false">最後に</button>\n' +
          '  <div class="afterword-content" hidden>\n' +
          '    <h2 class="aw-title">' + esc(title || "あとがき") + "</h2>\n" +
          "    " + pHtml + "\n" +
          "  </div>\n</div>";
        return;
      }

      var id = "ch" + chIndex;
      chIndex += 1;
      var displayTitle = title || (chapters.length === 1 ? "" : ("第" + chIndex + "話"));
      if (displayTitle) {
        tocItems.push('<li><a href="#' + id + '">' + softBreakTitle(displayTitle) + "</a></li>");
      }
      var titleHtml = displayTitle
        ? '  <h2 class="section-title">' + softBreakTitle(displayTitle) + "</h2>\n"
        : "";
      sectionsHtml.push(
        '<div class="section" id="' + id + '">\n' +
        titleHtml +
        "    " + pHtml + "\n" +
        "</div>"
      );
    });

    var toc = tocItems.length
      ? '<div id="toc">\n  <ol>\n    ' + tocItems.join("\n    ") + "\n  </ol>\n</div>\n\n"
      : "";
    return toc + sectionsHtml.join("\n\n") + (afterwordHtml ? "\n\n" + afterwordHtml : "");
  }

  function plainChunksToParagraphHtml(text) {
    text = String(text || "").replace(/\r\n/g, "\n").replace(/\r/g, "\n");
    // 単一改行 → 段落／空行 → 区切り線（hr.scene-break）
    var lines = text.split("\n");
    var html = "";
    var buffer = "";
    var pendingBreak = false;

    function flushBuffer() {
      var line = buffer.replace(/\s+/g, " ").trim();
      buffer = "";
      if (!line) return;
      if (pendingBreak && html) {
        html += '<hr class="scene-break" />';
        pendingBreak = false;
      }
      // 区切り記号だけの行も区切り線に
      if (/^(?:＊|※|\*|・|―|—|-|–|\.){1,6}$/.test(line) || /^[\*＊・](?:\s*[\*＊・]){1,5}$/.test(line)) {
        if (html) html += '<hr class="scene-break" />';
        pendingBreak = false;
        return;
      }
      var hm = line.match(/^#+\s+(.+)$/);
      if (hm) {
        html += '<h2 class="section-title">' + softBreakTitle(hm[1].trim()) + "</h2>";
        return;
      }
      var noIndent = /^[「『（(\[【─―—]/.test(line);
      html += "<p" + (noIndent ? ' class="no-indent"' : "") + ">" + esc(line) + "</p>";
    }

    lines.forEach(function (raw) {
      var line = raw.replace(/^\s+|\s+$/g, "");
      if (!line) {
        // 空行 → 直前の段落を確定し、次の段落の前に区切り線
        if (buffer) flushBuffer();
        if (html) pendingBreak = true;
        return;
      }
      // 単一改行も段落区切りとして扱う（小説のコピペ向け）
      if (buffer) flushBuffer();
      buffer = line;
    });
    flushBuffer();

    if (!html) {
      var one = text.replace(/\n/g, "").trim();
      if (one) html = "<p>" + esc(one) + "</p>";
    }
    return html;
  }

  function enterInlineBodyEdit(work, opts) {

    flattenWorkDom(main);

    app.querySelectorAll("nav.work-nav").forEach(function (n) { n.style.display = "none"; });

    var toolbar = document.createElement("div");

      '<button type="button" class="btn primary" data-save>保存</button>' +
      '</div>';
    main.parentNode.insertBefore(toolbar, main);

    // 章ジャンプ用 select を構築
    var jump = toolbar.querySelector("#chapter-jump");
    function listChapterTitles() {
      return Array.prototype.slice.call(main.querySelectorAll(".chapter-edit-title, h2.section-title"));
    }
    function listChapterBlocks() {
      return Array.prototype.slice.call(main.querySelectorAll(".chapter-edit-block"));
    }
    var headings = listChapterTitles();
    jump.innerHTML = '<option value="">— 章を選択 —</option>';
    headings.forEach(function (h, i) {
      h.setAttribute("data-chapter-idx", String(i));
      var block = h.closest ? h.closest(".chapter-edit-block") : null;
      if (block) block.setAttribute("data-chapter-idx", String(i));
      var opt = document.createElement("option");
      opt.value = String(i);
      opt.textContent = (h.textContent || "").trim() || ("章 " + (i + 1));
      jump.appendChild(opt);
    });

    function jumpToChapter(idx, highlight) {
      var blocks = listChapterBlocks();
      var block = blocks[idx];
      var h = block
        ? block.querySelector(".chapter-edit-title, h2.section-title")
        : main.querySelector('h2.section-title[data-chapter-idx="' + idx + '"]');
      if (!h) return;
      h.scrollIntoView({ behavior: "smooth", block: "start" });
      if (highlight) {
        main.querySelectorAll(".chapter-edit-title.is-jump-target, h2.section-title.is-jump-target").forEach(function (el) {
          el.classList.remove("is-jump-target");
        });
        h.classList.add("is-jump-target");
        setTimeout(function () { h.classList.remove("is-jump-target"); }, 1600);
      }
      try {
        var body = block ? block.querySelector(".chapter-edit-body") : null;
        var target = body || h;
        target.focus();
        var range = document.createRange();
        var firstP = body ? body.querySelector("p") : null;
        range.selectNodeContents(firstP || target);
        range.collapse(true);
        var sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
      } catch (err) {}
    }

    // プルダウンは「操作対象の選択」のみ。スクロール移動はしない
    jump.addEventListener("change", function () {
      // 選択だけ行い、自動ジャンプはしない
    });

    function appendChapter(title) {
      title = (title || "").trim() || "新しい章";
      var block = document.createElement("div");
      block.className = "chapter-edit-block";
      var h2 = document.createElement("h2");
      h2.className = "section-title chapter-edit-title";
      h2.setAttribute("contenteditable", "true");
      h2.setAttribute("spellcheck", "false");
      h2.textContent = title;
      var body = document.createElement("div");
      body.className = "chapter-edit-body";
      body.setAttribute("contenteditable", "true");
      body.setAttribute("spellcheck", "false");
      var p = document.createElement("p");
      p.textContent = "（ここに本文を書いてください）";
      body.appendChild(p);
      block.appendChild(h2);
      block.appendChild(body);

      // 章が選択されていればその直後に挿入、なければ末尾へ
      var blocks = listChapterBlocks();
      var selIdx = jump.value !== "" ? Number(jump.value) : -1;
      if (!isNaN(selIdx) && selIdx >= 0 && selIdx < blocks.length && blocks[selIdx]) {
        var ref = blocks[selIdx];
        if (ref.nextSibling) {
          main.insertBefore(block, ref.nextSibling);
        } else {
          main.appendChild(block);
        }
      } else {
        main.appendChild(block);
      }

      bindChapterEditors(block);
      refreshChapterJump();
      var newBlocks = listChapterBlocks();
      var newIdx = newBlocks.indexOf(block);
      if (newIdx < 0) newIdx = newBlocks.length - 1;
      jump.value = String(newIdx);
      setTimeout(function () { jumpToChapter(String(newIdx), true); }, 30);
    }

    function removeChapterByIndex(idx) {
      var blocks = listChapterBlocks();
      if (blocks[idx]) {
        blocks[idx].parentNode.removeChild(blocks[idx]);
        refreshChapterJump();
        return;
      }
      // 旧構造フォールバック
      var list = listChapterTitles();
      var h = list[idx];
      if (!h) return;
      var el = h;
      while (el) {
        var next = el.nextElementSibling;
        el.parentNode.removeChild(el);
        if (next && next.tagName === "H2") break;
        el = next;
      }
      refreshChapterJump();
    }

    /** 選択中の章を dir（-1:上 / +1:下）へ移動。戻り値は新しい index */
    function moveChapterByIndex(idx, dir) {
      var blocks = listChapterBlocks();
      if (!blocks.length) return idx;
      idx = Number(idx);
      if (isNaN(idx) || idx < 0 || idx >= blocks.length) return idx;
      var targetIdx = idx + dir;
      if (targetIdx < 0 || targetIdx >= blocks.length) return idx;
      var block = blocks[idx];
      var other = blocks[targetIdx];
      if (!block || !other || !block.parentNode) return idx;
      if (dir < 0) {
        block.parentNode.insertBefore(block, other);
      } else {
        if (other.nextSibling) {
          block.parentNode.insertBefore(block, other.nextSibling);
        } else {
          block.parentNode.appendChild(block);
        }
      }
      refreshChapterJump();
      jump.value = String(targetIdx);
      setTimeout(function () { jumpToChapter(String(targetIdx), true); }, 30);
      return targetIdx;
    }

    var addChapterBtn = toolbar.querySelector("[data-add-chapter]");
    if (addChapterBtn) addChapterBtn.addEventListener("click", function (e) {
      e.preventDefault();
      e.stopPropagation();
      // ツールバー内に簡易入力を出す（prompt / モーダルは編集状態を壊すため使わない）
      if (toolbar.querySelector(".chapter-add-row")) return;
      var row = document.createElement("div");
      row.className = "chapter-add-row";
      row.innerHTML =
        '<input type="text" inputmode="text" enterkeyhint="done" autocomplete="off" ' +
        'placeholder="章タイトル（例: 第十八話：…）" />' +
        '<button type="button" class="btn primary" data-confirm-add>追加</button>' +
        '<button type="button" class="btn" data-cancel-add>閉じる</button>';
      toolbar.appendChild(row);
      var input = row.querySelector("input");
      // ツールバー内入力中はキーボードでツールバーを隠さない
      function keepToolbarVisible() {
        toolbar.classList.remove("is-keyboard-open");
        document.body.classList.remove("keyboard-open");
      }
      input.addEventListener("focus", keepToolbarVisible);
      input.addEventListener("touchstart", function () {
        // フォーカス前に基準高さを更新し、誤判定を防ぐ
        _kbBaseH = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
      }, { passive: true });
      // 次フレームでフォーカス（レイアウト確定後）
      setTimeout(function () {
        try { input.focus(); } catch (err) {}
        keepToolbarVisible();
      }, 30);
      function doAdd() {
        appendChapter(input.value);
        if (row.parentNode) row.parentNode.removeChild(row);
      }
      row.querySelector("[data-confirm-add]").addEventListener("click", function (ev) {
        ev.preventDefault();
        ev.stopPropagation();
        doAdd();
      });
      row.querySelector("[data-cancel-add]").addEventListener("click", function (ev) {
        ev.preventDefault();
        ev.stopPropagation();
        if (row.parentNode) row.parentNode.removeChild(row);
      });
      input.addEventListener("keydown", function (ev) {
        // Enter では追加しない（「追加」ボタンでのみ確定）
        if (ev.key === "Enter") { ev.preventDefault(); }
        if (ev.key === "Escape") { if (row.parentNode) row.parentNode.removeChild(row); }
      });
    });

    var delChapterBtn = toolbar.querySelector("[data-del-chapter]");
    if (delChapterBtn) delChapterBtn.addEventListener("click", function (e) {
      e.preventDefault();
      e.stopPropagation();
      var idx = jump.value;
      if (idx === "") {
        alert("先に「章を選択」から削除する章を選んでください");
        return;
      }
      var list = listChapterTitles();
      var name = list[idx] ? (list[idx].textContent || "").trim() : "";
      if (!window.confirm("章「" + name + "」を削除しますか？\n（保存するまで反映されません）")) return;
      removeChapterByIndex(Number(idx));
      jump.value = "";
    });

    var copyFullBtn = toolbar.querySelector("[data-copy-full]");
    if (copyFullBtn) copyFullBtn.addEventListener("click", function (e) {
      e.preventDefault();
      e.stopPropagation();
      var plain = getNovelPlainFull();
      if (!plain || !String(plain).trim()) {
        alert("コピーする本文がありません");
        return;
      }
      // 作品タイトル / 空行 / サブタイトル / 空行 / 本文（章タイトルは本文側で空行付き）
      var parts = [];
      var wt = (work && work.title) ? String(work.title).trim() : "";
      var ws = (work && work.subtitle) ? String(work.subtitle).trim() : "";
      if (wt) parts.push(wt);
      if (ws) {
        if (parts.length) parts.push("");
        parts.push(ws);
      }
      if (parts.length) parts.push("");
      parts.push(plain);
      var full = parts.join("\n");
      copyFullBtn.disabled = true;
      copyTextToClipboard(full).then(function () {
        showSaveToast("本文をコピーしました");
      }).catch(function (err) {
        alert("コピーに失敗しました: " + (err && err.message ? err.message : err));
      }).then(function () {
        copyFullBtn.disabled = false;
      });
    });

    var moveUpBtn = toolbar.querySelector("[data-move-chapter-up]");
    if (moveUpBtn) moveUpBtn.addEventListener("click", function (e) {
      e.preventDefault();
      e.stopPropagation();
      var idx = jump.value;
      if (idx === "") {
        alert("先に「章を選択」から移動する章を選んでください");
        return;
      }
      moveChapterByIndex(Number(idx), -1);
    });

    var moveDownBtn = toolbar.querySelector("[data-move-chapter-down]");
    if (moveDownBtn) moveDownBtn.addEventListener("click", function (e) {
      e.preventDefault();
      e.stopPropagation();
      var idx = jump.value;
      if (idx === "") {
        alert("先に「章を選択」から移動する章を選んでください");
        return;
      }
      moveChapterByIndex(Number(idx), 1);
    });

    main.classList.add("is-editing");
    document.body.classList.add("is-editing");
    // 章タイトル／本文はそれぞれ独立した contenteditable（main 自体は編集不可）
    main.removeAttribute("contenteditable");
    main.setAttribute("spellcheck", "false");

    var _kbBaseH = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
    var _kbTimer = null;
    function isCoarseMobile() {
      return window.matchMedia("(max-width: 520px), (hover: none) and (pointer: coarse)").matches;
    }
    function syncToolbarKeyboard() {
      if (!toolbar.parentNode) return;
      if (!isCoarseMobile()) {
        toolbar.classList.remove("is-keyboard-open");
        document.body.classList.remove("keyboard-open");
        return;
      }
      var active = document.activeElement;
      if (active && toolbar.contains(active)) {
        var tag = active.tagName;
        if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA" || active.isContentEditable) {
          toolbar.classList.remove("is-keyboard-open");
          document.body.classList.remove("keyboard-open");
          return;
        }
      }
      var h = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
      var open = h < _kbBaseH * 0.82;
      toolbar.classList.toggle("is-keyboard-open", open);
      document.body.classList.toggle("keyboard-open", open);
    }
    function onKbViewportChange() {
      if (_kbTimer) clearTimeout(_kbTimer);
      _kbTimer = setTimeout(syncToolbarKeyboard, 60);
    }
    function onEditorFocus() {
      if (!document.body.classList.contains("keyboard-open")) {
        _kbBaseH = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
      }
      onKbViewportChange();
    }
    function onEditorBlur() {
      setTimeout(function () {
        if (!main.contains(document.activeElement)) {
          toolbar.classList.remove("is-keyboard-open");
          document.body.classList.remove("keyboard-open");
        }
        onKbViewportChange();
      }, 280);
    }
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", onKbViewportChange);
      window.visualViewport.addEventListener("scroll", onKbViewportChange);
    }
    window.addEventListener("resize", onKbViewportChange);
    main.addEventListener("focus", onEditorFocus, true);
    main.addEventListener("blur", onEditorBlur, true);
    main.addEventListener("input", onKbViewportChange);

    function insertHtmlAtSelection(html) {
      if (!html) return;
      if (document.queryCommandSupported && document.queryCommandSupported("insertHTML")) {
        document.execCommand("insertHTML", false, html);
        return;
      }
      var sel = window.getSelection();
      if (sel && sel.rangeCount) {
        var range = sel.getRangeAt(0);
        range.deleteContents();
        var tmp = document.createElement("div");
        tmp.innerHTML = html;
        var frag = document.createDocumentFragment();
        var node;
        while ((node = tmp.firstChild)) frag.appendChild(node);
        range.insertNode(frag);
      }
    }

    function onBodyPaste(e) {
      e.preventDefault();
      e.stopPropagation();
      var clip = e.clipboardData || window.clipboardData;
      var text = clip ? clip.getData("text/plain") : "";
      if (!text) return;
      // 章タイトル行（# 見出し）は本文貼り付け時には段落として扱い、新規章は作らない
      text = String(text).replace(/^#+\s+/gm, "");
      var html = plainChunksToParagraphHtml(text);
      insertHtmlAtSelection(html);
      refreshChapterJump();
    }

    function onTitlePaste(e) {
      e.preventDefault();
      e.stopPropagation();
      var clip = e.clipboardData || window.clipboardData;
      var text = clip ? clip.getData("text/plain") : "";
      if (!text) return;
      // タイトルは1行のみ
      var one = String(text).replace(/\r\n/g, "\n").replace(/\r/g, "\n").split("\n").map(function (l) {
        return l.trim();
      }).filter(Boolean).join("　");
      if (document.queryCommandSupported && document.queryCommandSupported("insertText")) {
        document.execCommand("insertText", false, one);
      } else {
        insertHtmlAtSelection(esc(one));
      }
      refreshChapterJump();
    }

    function onBodyDrop(e) {
      e.preventDefault();
      var text = e.dataTransfer ? e.dataTransfer.getData("text/plain") : "";
      if (!text) return;
      text = String(text).replace(/^#+\s+/gm, "");
      var html = plainChunksToParagraphHtml(text);
      insertHtmlAtSelection(html);
      refreshChapterJump();
    }

    function bindChapterEditors(scope) {
      scope = scope || main;
      scope.querySelectorAll(".chapter-edit-body").forEach(function (body) {
        if (body.getAttribute("data-edit-bound") === "1") return;
        body.setAttribute("data-edit-bound", "1");
        body.setAttribute("contenteditable", "true");
        body.setAttribute("spellcheck", "false");
        body.addEventListener("paste", onBodyPaste);
        body.addEventListener("drop", onBodyDrop);
      });
      scope.querySelectorAll(".chapter-edit-title").forEach(function (title) {
        if (title.getAttribute("data-edit-bound") === "1") return;
        title.setAttribute("data-edit-bound", "1");
        title.setAttribute("contenteditable", "true");
        title.setAttribute("spellcheck", "false");
        title.addEventListener("paste", onTitlePaste);

        function isImeComposing(ev) {
          // 日本語IME変換中の Enter（確定）を本文移動と誤判定しない
          return !!(ev && (ev.isComposing || ev.keyCode === 229));
        }

        function moveFocusToBody() {
          var block = title.closest(".chapter-edit-block");
          var body = block && block.querySelector(".chapter-edit-body");
          if (!body) return;
          // タイトル内の改行・余分なノードを掃除して1行に保つ
          var plain = (title.textContent || "").replace(/\s+/g, " ").trim();
          title.textContent = plain;
          body.focus();
          try {
            var p = body.querySelector("p");
            if (!p) {
              p = document.createElement("p");
              p.innerHTML = "<br>";
              body.appendChild(p);
            }
            var r = document.createRange();
            r.selectNodeContents(p);
            r.collapse(true);
            var s = window.getSelection();
            s.removeAllRanges();
            s.addRange(r);
          } catch (err) {}
        }

        // 改行の挿入自体をブロック（IME確定の Enter は通す）
        title.addEventListener("beforeinput", function (ev) {
          if (isImeComposing(ev)) return;
          if (ev.inputType === "insertParagraph" || ev.inputType === "insertLineBreak") {
            ev.preventDefault();
            moveFocusToBody();
          }
        });
        title.addEventListener("keydown", function (ev) {
          if (ev.key !== "Enter") return;
          if (isImeComposing(ev)) return; // 変換確定の Enter は無視
          ev.preventDefault();
          ev.stopPropagation();
          moveFocusToBody();
        });
        // 万一改行が入ったら除去
        title.addEventListener("input", function () {
          if (title.querySelector("br, div, p")) {
            var plain = (title.textContent || "").replace(/\s+/g, " ").trim();
            if (title.textContent !== plain) {
              title.textContent = plain;
            }
          }
        });
      });
    }
    bindChapterEditors(main);

    function refreshChapterJump() {
      var cur = jump.value;
      headings = listChapterTitles();
      jump.innerHTML = '<option value="">— 章を選択 —</option>';
      headings.forEach(function (h, i) {
        h.setAttribute("data-chapter-idx", String(i));
        var block = h.closest ? h.closest(".chapter-edit-block") : null;
        if (block) block.setAttribute("data-chapter-idx", String(i));
        var opt = document.createElement("option");
        opt.value = String(i);
        opt.textContent = (h.textContent || "").trim() || ("章 " + (i + 1));
        jump.appendChild(opt);
      });
      if (cur !== "" && Number(cur) < headings.length) jump.value = cur;
    }

    // 初期表示: 指定章 or ハッシュ or 先頭（保存後の再入場時はスクロール位置を維持）
    var focusTitle = opts.focusTitle || "";
    var focusIdx = -1;
    if (focusTitle) {
      for (var i = 0; i < headings.length; i++) {
        if ((headings[i].textContent || "").trim().indexOf(focusTitle) >= 0) {
          focusIdx = i;
          break;
        }
      }
    }
    if (focusIdx < 0 && location.hash && location.hash.indexOf("#ch") === 0) {
      // 閲覧時の #ch16 など → だいたいの順番でジャンプ
      var num = parseInt(location.hash.replace(/\D/g, ""), 10);
      if (!isNaN(num) && num >= 0 && num < headings.length) focusIdx = num;
    }

    if (opts.preserveScroll) {
      var y = typeof opts.scrollY === "number" ? opts.scrollY : (window.pageYOffset || 0);
      window.scrollTo(0, y);
      // フォーカスは取らない（モバイルでキーボードが再オープンするのを防ぐ）
    } else if (focusIdx >= 0) {
      jump.value = String(focusIdx);
      setTimeout(function () { jumpToChapter(String(focusIdx), true); }, 50);
    } else {
      try {
        var firstBody = main.querySelector(".chapter-edit-body");
        var first = firstBody
          ? (firstBody.querySelector("p") || firstBody)
          : main.querySelector("p, h2");
        if (firstBody) firstBody.focus();
        if (first) {
          var range = document.createRange();
          range.selectNodeContents(first);
          range.collapse(true);
          var sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
        }
      } catch (err) {}
      window.scrollTo(0, Math.max(0, toolbar.getBoundingClientRect().top + window.pageYOffset - 8));
    }

    // トップページへ / 目次
    var homeLink = toolbar.querySelector("[data-edit-home]");
    if (homeLink) homeLink.addEventListener("click", function (e) {
      e.preventDefault();
      location.hash = "#/";
    });
    var tocLink = toolbar.querySelector("[data-edit-toc]");
    if (tocLink) tocLink.addEventListener("click", function (e) {
      e.preventDefault();
      // 編集中はフラット構造のため、章選択を開いて目次代わりにする
      jump.focus();
      try { jump.click(); } catch (err) {}
      // 一覧を見やすくするため、先頭の章へスクロールも可能にする
      if (jump.options.length > 1) {
        // セレクトを強調
        jump.style.boxShadow = "0 0 0 1px var(--accent)";
        setTimeout(function () { jump.style.boxShadow = ""; }, 1200);
      }
    });

    var secretGuideLink = toolbar.querySelector("[data-secret-guide]");
    if (secretGuideLink) secretGuideLink.addEventListener("click", function (e) {
      e.preventDefault();
      e.stopPropagation();
      openSecretGuideModal();
    });

    var saveBtn = toolbar.querySelector("[data-save]");

    function clearEditAttrs() {
      main.classList.remove("is-editing");
      document.body.classList.remove("is-editing");
      document.body.classList.remove("keyboard-open");
      main.removeAttribute("contenteditable");
      main.removeAttribute("spellcheck");
      main.querySelectorAll(".chapter-edit-title, .chapter-edit-body").forEach(function (el) {
        el.removeAttribute("contenteditable");
        el.removeAttribute("spellcheck");
        el.removeAttribute("data-edit-bound");
      });
      main.removeEventListener("focus", onEditorFocus, true);
      main.removeEventListener("blur", onEditorBlur, true);
      main.removeEventListener("input", onKbViewportChange);
      if (window.visualViewport) {
        window.visualViewport.removeEventListener("resize", onKbViewportChange);
        window.visualViewport.removeEventListener("scroll", onKbViewportChange);
      }
      window.removeEventListener("resize", onKbViewportChange);
      if (_kbTimer) clearTimeout(_kbTimer);
      toolbar.classList.remove("is-keyboard-open");
    }

    saveBtn.addEventListener("click", async function () {
      if (saveBtn.disabled) return;
      saveBtn.textContent = "保存中...";
      saveBtn.disabled = true;
      try {
        var html = rebuildWorkHtmlFromFlat(main);
        await saveWork(work.id, { content: html });
        work.content = html;
        if (cache && cache.works) {
          var cw = cache.works.filter(function (w) { return w.id === work.id; })[0];
          if (cw) cw.content = html;
        }
        var scrollY = window.pageYOffset || document.documentElement.scrollTop || 0;
        clearEditAttrs();
        if (toolbar.parentNode) toolbar.parentNode.removeChild(toolbar);
        main.innerHTML = formatContent(html);
        attachWorkInteractions();
        enterInlineBodyEdit(work, { preserveScroll: true, scrollY: scrollY });
        showSaveToast("保存完了！");
      } catch (err) {
        alert("保存に失敗しました: " + (err && err.message ? err.message : err));
        saveBtn.textContent = "保存";
        saveBtn.disabled = false;
      }
    });
  }

  /* ===== ハッシュ変更でのルーティング（"#/"で始まるもののみ） ===== */
  window.addEventListener("hashchange", function () {
    if (location.hash.indexOf("#/") === 0 || location.hash === "") {
      // ページ移動ごとに最新データを取得して再描画（キャッシュ維持＋即時表示）
      navigateAndRefresh();
    }
  });

  document.addEventListener("click", function (e) {
    var a = e.target.closest("a[data-home]");
    if (a) { e.preventDefault(); location.hash = "#/"; }
  });

  /* ===== 認証状態の監視 ===== */
  onAuthStateChanged(auth, function (user) {
    currentUser = user;
    if (!user) {
      manageMode = false;
      try { sessionStorage.setItem("luna3-manage-mode", "0"); } catch (e) {}
    }
    updateFab();
    if (cache) render();
  });

  /* ===== 初期化 ===== */
  updateFab();
  if (location.hash.indexOf("#/") !== 0) location.hash = "#/";
  Promise.resolve(render()).then(function () {
    if (isEn()) scheduleTranslateDom();
  });

  // エピグラフ5回タップ → 言語切替（単一ハンドラのみ）
  (function setupLangGesture() {
    var taps = 0;
    var last = 0;
    var GAP = 900;
    var lockUntil = 0;
    function onTap(ev) {
      if (Date.now() < lockUntil) return;
      var t = ev.target;
      if (!t || !t.closest) return;
      var epi = t.closest("#epigraph-area");
      if (!epi) return;
      if (t.closest("button, a, input, textarea, select")) return;
      var now = Date.now();
      if (now - last > GAP) taps = 0;
      last = now;
      taps += 1;
      try {
        epi.classList.add("is-egg-pulse");
        setTimeout(function () { epi.classList.remove("is-egg-pulse"); }, 180);
      } catch (e) {}
      if (taps >= 5) {
        taps = 0;
        lockUntil = Date.now() + 1500; // 連続発火防止
        if (isEn()) switchToJapanese();
        else switchToEnglish();
      }
    }
    document.addEventListener("pointerup", onTap, true);
    document.addEventListener("touchend", onTap, true);
    document.addEventListener("click", function (ev) {
      // pointer イベントが来ない環境向け
      if (window.PointerEvent) return;
      onTap(ev);
    }, true);
  })();

</script>
</body>
</html>
